<style>
:root{
  --ground:#EFF3F1; --surface:#FFFFFF; --surface2:#E6EDEA; --sunk:#F6F9F8;
  --ink:#101F1D; --ink2:#3C514C; --muted:#788C87;
  --line:#D9E3DF; --line2:#C3D2CD;
  --accent:#0E6B5E; --accent-ink:#0E6B5E; --accent-soft:#D6E9E4;
  --pos:#1C7A55; --neg:#AE4029; --warn:#9C6510;
  --pos-soft:#DCEFE5; --neg-soft:#F7E2DC; --warn-soft:#F6EBD8;
  --shadow:0 1px 2px rgba(16,31,29,.06), 0 6px 18px -12px rgba(16,31,29,.25);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C1312; --surface:#141E1C; --surface2:#1C2926; --sunk:#101A18;
    --ink:#E7EEEB; --ink2:#B6C6C1; --muted:#7F938E;
    --line:#243330; --line2:#31433F;
    --accent:#4FCEB4; --accent-ink:#4FCEB4; --accent-soft:#16332E;
    --pos:#4CC28C; --neg:#E5806A; --warn:#D8A24F;
    --pos-soft:#14302A; --neg-soft:#33201B; --warn-soft:#2E2617;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0C1312; --surface:#141E1C; --surface2:#1C2926; --sunk:#101A18;
  --ink:#E7EEEB; --ink2:#B6C6C1; --muted:#7F938E;
  --line:#243330; --line2:#31433F;
  --accent:#4FCEB4; --accent-ink:#4FCEB4; --accent-soft:#16332E;
  --pos:#4CC28C; --neg:#E5806A; --warn:#D8A24F;
  --pos-soft:#14302A; --neg-soft:#33201B; --warn-soft:#2E2617;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;}
.wrap{max-width:540px; margin:0 auto; padding:0 14px 96px;}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif; font-weight:600; margin:0; text-wrap:balance;}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}

header{position:sticky; top:0; z-index:30; background:var(--ground); padding:14px 0 8px;}
.hrow{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
.brand{font-size:19px; letter-spacing:-.01em;}
.mes{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.09em;}
.iconbtn{appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink2);
  border-radius:9px; width:34px; height:34px; font-size:15px; cursor:pointer; display:grid; place-items:center;}
.iconbtn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; margin:12px 0; box-shadow:var(--shadow);}
.card.flat{box-shadow:none;}
.card.alerta{border-color:var(--warn);}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.11em; color:var(--muted); font-weight:600;}
.big{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:30px; font-weight:600; letter-spacing:-.03em; line-height:1.1;}
.mid{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:19px; font-weight:600; letter-spacing:-.02em;}
.sub{font-size:12.5px; color:var(--muted);}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warnc{color:var(--warn)}
.split{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.split3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.split3 input{padding:8px 9px; font-size:14px;}
.split3 label{font-size:11px;}
.tile{background:var(--sunk); border:1px solid var(--line); border-radius:10px; padding:10px;}
.rowline{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
.rowline:last-child{border-bottom:0;}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px;
  border-radius:99px; border:1px solid transparent; letter-spacing:.02em;}
.pill.good{background:var(--pos-soft); color:var(--pos); border-color:var(--pos);}
.pill.hold{background:var(--surface2); color:var(--ink2); border-color:var(--line2);}
.pill.warn{background:var(--warn-soft); color:var(--warn); border-color:var(--warn);}
.pill.bad{background:var(--neg-soft); color:var(--neg); border-color:var(--neg);}

.meter{height:8px; border-radius:99px; background:var(--surface2); overflow:hidden; display:flex;}
.meter i{display:block; height:100%;}
.barrow{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:baseline; padding:7px 0;}
.barrow .track{grid-column:1/-1; height:7px; border-radius:4px; background:var(--surface2); overflow:hidden;}
.barrow .track i{display:block; height:100%; background:var(--accent); border-radius:4px;}
.barlbl{font-size:13.5px; color:var(--ink2);}
.barval{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:13px;}

/* checklist de pagos */
.pay{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
  padding:9px 0; border-bottom:1px solid var(--line);}
.pay:last-child{border-bottom:0;}
.check{appearance:none; width:28px; height:28px; border-radius:99px; cursor:pointer;
  border:1.5px solid var(--line2); background:var(--surface); color:transparent;
  font-size:15px; line-height:1; display:grid; place-items:center; padding:0; flex:none;}
.check[aria-pressed="true"]{background:var(--pos); border-color:var(--pos); color:#fff;}
:root[data-theme="dark"] .check[aria-pressed="true"]{color:#0C1312;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .check[aria-pressed="true"]{color:#0C1312;}}
.pay.hecho .paylbl{color:var(--muted); text-decoration:line-through;}
.paylbl{font-weight:600; font-size:14px;}
.pay .num{font-size:14px; white-space:nowrap;}
.diachip{width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
  background:var(--surface2); color:var(--ink2); font-size:12px; font-weight:600;
  font-family:"IBM Plex Mono",monospace; flex:none;}
.diachip.ing{background:var(--pos-soft); color:var(--pos);}

.strip{display:flex; align-items:stretch; gap:3px; height:74px; margin-top:6px;}
.strip button{flex:1; background:none; border:0; padding:0; cursor:pointer; display:flex; flex-direction:column;}
.strip .half{flex:1; display:flex;}
.strip .half.up{align-items:flex-end;}
.strip .half.dn{align-items:flex-start;}
.strip .half i{display:block; width:100%; background:var(--accent); border-radius:3px 3px 0 0;}
.strip .half.dn i{background:var(--neg); border-radius:0 0 3px 3px;}
.strip .mid0{flex:0 0 1px; background:var(--line2);}
.striplbl{display:flex; gap:3px; margin-top:4px;}
.striplbl span{flex:1; text-align:center; font-size:9px; color:var(--muted);}

label{display:block; font-size:12px; font-weight:600; color:var(--ink2); margin:0 0 5px; letter-spacing:.01em;}
input,select,textarea{width:100%; font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--line2); border-radius:10px; padding:10px 11px;}
input[type="number"]{font-family:"IBM Plex Mono",monospace;}
.field{margin-bottom:12px;}
.montoin input{font-size:28px; font-weight:600; text-align:right; padding:12px 14px; letter-spacing:-.02em;}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{appearance:none; font:inherit; font-size:13px; padding:7px 11px; border-radius:99px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line2); color:var(--ink2);}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0C1312;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0C1312;}}
.chip small{opacity:.75; font-size:10px; margin-left:3px;}
.btn{appearance:none; font:inherit; font-weight:600; cursor:pointer; border-radius:10px; padding:12px 16px;
  background:var(--accent); color:#fff; border:1px solid var(--accent); width:100%; font-size:15px;}
:root[data-theme="dark"] .btn:not(.ghost){color:#0C1312;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#0C1312;}}
.btn.ghost{background:var(--surface); color:var(--ink2); border-color:var(--line2);}
.btn.mini{padding:7px 12px; font-size:13px; width:auto;}
.btn:disabled{opacity:.5; cursor:default;}
.note{font-size:12.5px; color:var(--muted); margin-top:6px;}
.note.hint{background:var(--sunk); border:1px solid var(--line); border-radius:10px; padding:10px; color:var(--ink2);}
.oculto{display:none !important;}

nav{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface);
  border-top:1px solid var(--line); padding:6px 0 max(6px, env(safe-area-inset-bottom));}
nav .inner{max-width:540px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr);}
nav button{min-width:0}
nav button span{overflow:hidden; text-overflow:ellipsis; max-width:100%}
nav button{appearance:none; background:none; border:0; cursor:pointer; padding:5px 2px; color:var(--muted);
  font:inherit; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px;}
nav button svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
nav button[aria-current="true"]{color:var(--accent); font-weight:600;}

.tabs{display:flex; gap:6px; margin:10px 0;}
.tabs .chip{flex:1; text-align:center;}
.empty{text-align:center; color:var(--muted); padding:26px 10px; font-size:13.5px;}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:78px; z-index:60;
  background:var(--ink); color:var(--ground); padding:9px 15px; border-radius:99px; font-size:13px;
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s;}
.toast.on{opacity:1;}
details summary{cursor:pointer; font-size:13px; color:var(--accent-ink); font-weight:600; list-style:none;}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";}
details[open] summary::before{content:"– ";}
.savechip{font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:5px;}
.savechip i{width:6px; height:6px; border-radius:99px; background:var(--muted); display:block;}
.savechip.ok i{background:var(--pos)} .savechip.err i{background:var(--warn)}
#gate{max-width:420px; margin:0 auto; padding:36px 16px;}
#gate .card{padding:20px;}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}

var CC_URL = "https://script.google.com/macros/s/AKfycbwFLzuWW_LSuZdFXRR0dWQdGInMCmdQ6OLIe_hqXdXoX9XGgD0bUprvqXo0__vl9WkzxA/exec";

          <div class="mes" id="hdr-mes"></div>

<script>
(function(){
"use strict";

/* ================================================================ utils */
var fmt0 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:0});
var fmt1 = new Intl.NumberFormat("es-AR",{minimumFractionDigits:1, maximumFractionDigits:1});
function money(n){ if(!isFinite(n)) n=0; return (n<0?"-$":"$")+fmt0.format(Math.abs(Math.round(n))); }
function pct(n){ return fmt1.format(n*100)+"%"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

var MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
               "septiembre","octubre","noviembre","diciembre"];
function mk(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function hoyISO(){ var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mesDe(iso){ return String(iso||"").slice(0,7); }
function addM(key,n){ var y=+key.slice(0,4), m=+key.slice(5,7)-1+n;
  y += Math.floor(m/12); m=((m%12)+12)%12; return y+"-"+String(m+1).padStart(2,"0"); }
function diffM(a,b){ return (+a.slice(0,4)-+b.slice(0,4))*12 + (+a.slice(5,7)-+b.slice(5,7)); }
function mesLbl(k,largo){ var m=+k.slice(5,7)-1;
  return MESES[m]+(largo? " "+k.slice(0,4) : " "+k.slice(2,4)); }
function mesLargo(k){ return MESES_L[+k.slice(5,7)-1]+" "+k.slice(0,4); }
function mesTxt(v){ var s=String(v||"").slice(0,7); return /^\d{4}-\d{2}$/.test(s)? s : null; }

function PV(r,n,c){ if(n<=0) return 0; if(!r) return n*c; return c*(1-Math.pow(1+r,-n))/r; }
function tasaImplicita(k,c,n){
  if(!(k>0)||!(c>0)||!(n>0)) return 0;
  if(c*n<=k) return 0;
  var lo=0, hi=3, r;
  for(var i=0;i<80;i++){ r=(lo+hi)/2; if(PV(r,n,c)>k) lo=r; else hi=r; }
  return (lo+hi)/2;
}

/* ================================================================ estado */
function semilla(){
  return {
    config:{ tasaRef:0.025, saldo:0, agruparCuotas:true, verPlan:true, horizonte:24 },
    categorias:[{nombre:"Otros", fila:0}],
    medios:[{nombre:"Efectivo", tipo:"efectivo", cierre:0, fila:0}],
    movimientos:[], pagos:[], ingresos:[], fijos:[], presupuestos:[], metas:[]
  };
}
var VERSION = 5;
/* Rellena lo que falte: así un caché viejo o una planilla sin las hojas nuevas
   no rompen la app. */
function sanear(d){
  var base = semilla();
  if(!d || typeof d!=="object") return base;
  d.config = d.config && typeof d.config==="object" ? d.config : {};
  for(var k in base.config){
    if(!Object.prototype.hasOwnProperty.call(d.config,k) || d.config[k]===undefined ||
       d.config[k]===null) d.config[k]=base.config[k];
  }
  ["categorias","medios","movimientos","pagos","ingresos","fijos","presupuestos","metas"]
    .forEach(function(k){ if(!Array.isArray(d[k])) d[k]=[]; });
  if(!d.categorias.length) d.categorias = base.categorias;
  if(!d.medios.length) d.medios = base.medios;
  d.medios = d.medios.map(function(m){
    return {id:m.id||("e"+(m.fila||0)), fila:m.fila||0, nombre:m.nombre||"Efectivo",
            tipo: m.tipo==="credito"?"credito":"efectivo",
            cierre:+m.cierre||0, vence:+m.vence||0, mant:+m.mant||0,
            mantDesde: mesTxt(m.mantDesde)};
  });
  d.v = VERSION;
  return d;
}

var S = semilla();
var mesHoy = mk(new Date());
var vista = "panel";
var saveState = "ok";
var sesion = { url:"", pin:"" };
var cola = [];
var enviando = false;
var ultimaSync = 0;

/* ============================================================ derivados */
function medio(nombre){
  for(var i=0;i<S.medios.length;i++) if(S.medios[i].nombre===nombre) return S.medios[i];
  return {nombre:nombre, tipo:"efectivo", cierre:0};
}
function esCredito(mv){ return medio(mv.medio).tipo==="credito"; }
function cuotaDe(mv){ return mv.monto / Math.max(1, mv.cuotas||1); }
function primerMes(mv){
  if(mesTxt(mv.primera)) return mesTxt(mv.primera);
  var mes = mesDe(mv.fecha);
  var md = medio(mv.medio);
  if(md.tipo!=="credito") return mes;
  var dia = +String(mv.fecha).slice(8,10) || 1;
  var cierre = +md.cierre>0 ? +md.cierre : 31;
  var vence = +md.vence || 0;
  /* si el vencimiento cae después del cierre, el resumen se paga en el mismo mes */
  var salto = (vence>0 && vence>cierre) ? 0 : 1;
  if(dia>cierre) salto += 1;
  return addM(mes, salto);
}
function esPlan(mv){ return mv.estado==="Planificado"; }
function cuentaEn(mv){ return !esPlan(mv) || S.config.verPlan!==false; }
function ultimoMes(mv){ return addM(primerMes(mv), Math.max(1,mv.cuotas||1)-1); }
function activoEn(mv,mes){ var p=primerMes(mv); return mes>=p && mes<=ultimoMes(mv); }

function mantenimientoDe(m, mes){
  if(m.tipo!=="credito" || !(+m.mant>0)) return 0;
  var desde = m.mantDesde || mesHoy;
  return mes>=desde ? +m.mant : 0;
}
function mantenimientoMes(mes){
  return S.medios.reduce(function(a,m){ return a+mantenimientoDe(m,mes); },0);
}
function claveMedio(n){ return "MEDIO:"+n; }
function claveFijo(f){ return "FIJO:"+f.fila; }
function pagoDe(clave, mes){
  for(var i=0;i<S.pagos.length;i++){
    if(S.pagos[i].clave===clave && S.pagos[i].mes===mes) return S.pagos[i];
  }
  return null;
}
function pagado(clave, mes){ return !!pagoDe(clave, mes); }

function cuotasPagadas(mv){
  if(esPlan(mv)) return 0;
  if(!esCredito(mv)) return mv.cuotas||1;
  var n=0, m=primerMes(mv), fin=ultimoMes(mv), cl=claveMedio(mv.medio);
  while(m<=fin){ if(pagado(cl,m)) n++; m=addM(m,1); }
  return n;
}
function atrasadasDe(mv){
  if(!esCredito(mv) || esPlan(mv)) return 0;
  var venc = Math.min(mv.cuotas, Math.max(0, diffM(mesHoy, primerMes(mv))));
  var pag=0, m=primerMes(mv), cl=claveMedio(mv.medio);
  for(var i=0;i<venc;i++){ if(pagado(cl,m)) pag++; m=addM(m,1); }
  return Math.max(0, venc-pag);
}
function movCalc(mv){
  var c = cuotaDe(mv);
  var pagadas = cuotasPagadas(mv);
  var pend = Math.max(0, (mv.cuotas||1) - pagadas);
  var nominal = pend*c;
  var tasa = (mv.contado>0 && (mv.cuotas||1)>1) ? tasaImplicita(mv.contado, c, mv.cuotas) : 0;
  var cancelar = tasa>0 ? PV(tasa, pend, c) : nominal;
  var seguir = PV(S.config.tasaRef, pend, c);
  return {cuota:c, pagadas:pagadas, pend:pend, nominal:nominal, tasa:tasa,
          cancelar:cancelar, seguir:seguir, ahorro:seguir-cancelar,
          porPeso: cancelar>0 ? (seguir-cancelar)/cancelar : 0,
          atrasadas: atrasadasDe(mv), primera:primerMes(mv), ultima:ultimoMes(mv)};
}
function vigente(x,mes){
  if(x.desde && mes<x.desde) return false;
  if(x.hasta && mes>x.hasta) return false;
  return true;
}
function presupuestoDe(cat, mes){
  for(var i=0;i<S.presupuestos.length;i++){
    var b=S.presupuestos[i];
    if(b.categoria===cat && b.modo==="presupuesto" && vigente(b,mes)) return b;
  }
  return null;
}
function enSobre(mv, mes){ return !!presupuestoDe(mv.categoria, mes); }
function presupuestosMes(mes){
  return S.presupuestos.reduce(function(a,b){
    return a + (b.modo==="presupuesto" && vigente(b,mes) ? b.tope : 0); },0);
}
function gastadoEn(cat, mes){
  return S.movimientos.reduce(function(a,mv){
    return a + (mv.categoria===cat && activoEn(mv,mes) && cuentaEn(mv) ? cuotaDe(mv) : 0); },0);
}
function aporteMeta(m, mes, ing, sobrante){
  if(!vigente(m,mes)) return 0;
  if(m.tipo==="pctIngreso") return m.valor*ing;
  if(m.tipo==="pctSobrante") return m.valor*Math.max(0,sobrante);
  return m.valor;
}
function acumuladoMeta(m){
  return S.pagos.reduce(function(a,p){
    return a + (p.clave==="META:"+m.fila ? p.monto : 0); },0);
}
function ingresosMes(mes){ return S.ingresos.reduce(function(a,x){ return a+(vigente(x,mes)? +x.monto||0 :0); },0); }
function fijosMes(mes){ return S.fijos.reduce(function(a,x){ return a+(vigente(x,mes)? +x.monto||0 :0); },0); }
function creditoMes(mes){ return S.movimientos.reduce(function(a,mv){
  return a+(esCredito(mv)&&activoEn(mv,mes)&&cuentaEn(mv)&&!enSobre(mv,mes)? cuotaDe(mv):0); },0)
  + mantenimientoMes(mes); }
function efectivoMes(mes){ return S.movimientos.reduce(function(a,mv){
  return a+(!esCredito(mv)&&activoEn(mv,mes)&&cuentaEn(mv)&&!enSobre(mv,mes)? cuotaDe(mv):0); },0); }
function planMes(mes){ return S.movimientos.reduce(function(a,mv){
  return a+(esPlan(mv)&&activoEn(mv,mes)? cuotaDe(mv):0); },0); }

/* obligaciones marcables de un mes */
function obligaciones(mes){
  var out=[];
  S.medios.forEach(function(m){
    if(m.tipo!=="credito") return;
    var tot=0, n=0;
    S.movimientos.forEach(function(mv){
      if(mv.medio===m.nombre && esCredito(mv) && !esPlan(mv) && activoEn(mv,mes)){ tot+=cuotaDe(mv); n++; }
    });
    var mant=mantenimientoDe(m,mes);
    tot+=mant;
    if(tot>0.5){
      var det = n? n+(n===1?" cuota":" cuotas") : "";
      if(mant>0) det += (det?" + ":"")+"mantenimiento "+money(mant);
      out.push({clave:claveMedio(m.nombre), concepto:m.nombre, detalle:det,
        monto:tot, mes:mes, tipo:"credito", dia:+m.vence||0});
    }
  });
  S.fijos.forEach(function(f){
    if(f.pago==="Automático" || !vigente(f,mes) || !f.fila) return;
    out.push({clave:claveFijo(f), concepto:f.concepto,
      detalle:f.categoria, monto:+f.monto||0, mes:mes, tipo:"fijo", dia:f.dia||0});
  });
  var dm=mesData(mes,false);
  S.metas.forEach(function(g){
    if(!vigente(g,mes) || !g.fila) return;
    var ap=aporteMeta(g,mes,dm.ingresos,dm.sobrante);
    if(ap<=0.5) return;
    out.push({clave:"META:"+g.fila, concepto:"Apartar para "+g.nombre,
      detalle:(g.tipo==="fijo"?"monto fijo":g.tipo==="pctIngreso"?pct(g.valor)+" del ingreso":pct(g.valor)+" del sobrante"),
      monto:ap, mes:mes, tipo:"meta", dia:g.dia||1});
  });
  return out;
}
function atrasos(){
  var out=[];
  for(var i=24;i>=1;i--){
    var m=addM(mesHoy,-i);
    obligaciones(m).forEach(function(o){ if(!pagado(o.clave,o.mes)) out.push(o); });
  }
  return out;
}
function totalAtrasado(){ return atrasos().reduce(function(a,o){ return a+o.monto; },0); }

function mesData(mes, conAtraso){
  var ing=ingresosMes(mes), fj=fijosMes(mes), cr=creditoMes(mes), ef=efectivoMes(mes);
  var pre=presupuestosMes(mes);
  var atr = conAtraso ? totalAtrasado() : 0;
  var gastos = fj+pre+cr+ef+atr;
  var sobrante = ing-gastos;
  var ahorro = S.metas.reduce(function(a,m){ return a+aporteMeta(m,mes,ing,sobrante); },0);
  return {mes:mes, ingresos:ing, fijos:fj, presupuestos:pre, credito:cr, efectivo:ef,
          atrasado:atr, plan:planMes(mes), gastos:gastos, sobrante:sobrante,
          ahorro:ahorro, balance:sobrante-ahorro};
}
function proyeccion(n){
  var out=[], acum=0, saldo=+S.config.saldo||0;
  for(var i=0;i<n;i++){
    var d=mesData(addM(mesHoy,i), i===0);
    acum+=d.balance; d.acum=acum; d.saldo=saldo+acum; out.push(d);
  }
  return out;
}
function primerRojo(){
  var p=proyeccion(S.config.horizonte||24);
  for(var i=0;i<p.length;i++) if(p[i].saldo<0) return p[i];
  return null;
}
function porCategoria(mes){
  var map={};
  S.categorias.forEach(function(c){ map[c.nombre]=0; });
  function add(c,v){ if(!(c in map)) map[c]=0; map[c]+=v; }
  S.fijos.forEach(function(f){ if(vigente(f,mes)) add(f.categoria||"Otros", +f.monto||0); });
  S.movimientos.forEach(function(mv){
    if(!activoEn(mv,mes) || !cuentaEn(mv) || enSobre(mv,mes)) return;
    var cat = (S.config.agruparCuotas && esCredito(mv)) ? "Créditos" : (mv.categoria||"Otros");
    add(cat, cuotaDe(mv));
  });
  S.presupuestos.forEach(function(b){
    if(b.modo==="presupuesto" && vigente(b,mes)) add(b.categoria, b.tope);
  });
  add("Créditos", mantenimientoMes(mes));
  return Object.keys(map).map(function(k){ return {cat:k, v:map[k]}; })
    .filter(function(x){ return x.v>0.5; })
    .sort(function(a,b){ return b.v-a.v; });
}
function deudaTotal(){
  return S.movimientos.reduce(function(a,mv){
    return a + (esCredito(mv)&&!esPlan(mv)? movCalc(mv).nominal : 0); },0);
}

/* ========================================================= persistencia */
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); },1900);
}
function pintarSave(){
  var el=document.getElementById("savechip");
  if(!el) return;
  var txt = saveState==="saving" ? "Guardando…" :
            saveState==="pendiente" ? (cola.length+" sin subir") :
            saveState==="offline" ? "Sin conexión" : "Sincronizado";
  el.className="savechip "+(saveState==="ok"?"ok":saveState==="saving"?"":"err");
  el.querySelector("span").textContent=txt;
}
function cache(){
  try{
    localStorage.setItem("cc_datos", JSON.stringify(S));
    localStorage.setItem("cc_cola", JSON.stringify(cola));
  }catch(e){}
}
function api(o){
  var body={token:sesion.pin};
  for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) body[k]=o[k]; }
  return fetch(sesion.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(body), redirect:"follow"}).then(function(r){ return r.json(); });
}
function marcarFila(cid, fila){
  ["movimientos","pagos","ingresos","fijos","medios","categorias","metas","presupuestos"].forEach(function(k){
    S[k].forEach(function(x){ if(x.id===cid) x.fila=fila; });
  });
}
function quitarDeCola(cid){ cola = cola.filter(function(o){ return o.cid!==cid; }); }
function op(o){ cola.push(o); cache(); pintarSave(); flush(); }

function flush(){
  if(enviando || !cola.length || !sesion.pin || !sesion.url) return;
  enviando=true; saveState="saving"; pintarSave();
  var o=cola[0];
  api(o).then(function(r){
    enviando=false;
    if(r && r.ok){
      if(o.cid && r.fila) marcarFila(o.cid, r.fila);
      cola.shift(); cache();
      if(cola.length) flush();
      else { saveState="ok"; ultimaSync=Date.now(); pintarSave(); cache(); render(); }
      return;
    }
    if(r && r.error==="auth"){ saveState="offline"; pintarSave(); toast("El PIN ya no coincide"); salir(); return; }
    if(r && r.error==="sin_espacio"){ cola.shift(); cache(); saveState="pendiente"; pintarSave();
      toast("No quedan filas libres en el Sheet"); return; }
    /* Error definitivo del script (hoja o columna que no existe, acción vieja...):
       lo descartamos para que no trabe todo lo que viene atrás. */
    if(r && r.ok===false){
      cola.shift(); cache();
      toast("Un cambio no se pudo guardar en el Sheet ("+(r.error||"error")+")");
      if(cola.length) flush(); else { saveState="ok"; pintarSave(); }
      return;
    }
    saveState="pendiente"; pintarSave();
  }, function(){ enviando=false; saveState="pendiente"; pintarSave(); });
}

function itemPorId(arr,id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function borrarItem(clave, hoja, id){
  var it=itemPorId(S[clave], id);
  if(!it) return;
  S[clave]=S[clave].filter(function(x){ return x.id!==id; });
  if(it.fila) op({action:"del", hoja:hoja, fila:it.fila});
  else { quitarDeCola(id); cache(); pintarSave(); }
}

/* ------------------------------- traducción desde/hacia el Sheet ------ */
function desdeSheet(d){
  var s = semilla();
  s.config.tasaRef = (d.config && +d.config.tasaRef) || 0.025;
  s.config.saldo = (d.config && +d.config.saldo) || 0;
  try{ var prev=JSON.parse(localStorage.getItem("cc_datos")||"null");
       if(prev && prev.config){
         s.config.agruparCuotas = !!prev.config.agruparCuotas;
         s.config.verPlan = prev.config.verPlan!==false;
       } }catch(e){}
  s.categorias = (d.categorias||[]).map(function(c){
    return {id:"c"+c.fila, fila:c.fila, nombre:c.nombre}; });
  if(!s.categorias.length) s.categorias=[{id:"c0", fila:0, nombre:"Otros"}];
  s.medios = (d.medios||[]).map(function(m){
    return {id:"e"+m.fila, fila:m.fila, nombre:m.nombre,
            tipo: m.tipo==="credito"?"credito":"efectivo", cierre:+m.cierre||0,
            vence:+m.vence||0, mant:+m.mant||0, mantDesde: mesTxt(m.mantDesde)}; });
  if(!s.medios.length) s.medios=[{id:"e0", fila:0, nombre:"Efectivo", tipo:"efectivo", cierre:0,
            vence:0, mant:0, mantDesde:null}];
  s.movimientos = (d.Movimientos||[]).map(function(r){
    var v=r.vals;
    var o={id:"m"+r.fila, fila:r.fila, fecha:String(v[0]).slice(0,10),
      detalle:v[1]||"(sin detalle)", categoria:v[2]||"Otros", medio:v[3]||"Efectivo",
      monto:+v[4]||0, cuotas:Math.max(1,+v[5]||1)};
    if(+v[6]>0) o.contado=+v[6];
    if(mesTxt(v[7])) o.primera=mesTxt(v[7]);
    if(String(v[8]).indexOf("Plan")===0) o.estado="Planificado";
    return o;
  }).filter(function(m){ return m.monto>0 && /^\d{4}-\d{2}-\d{2}$/.test(m.fecha); });
  s.pagos = (d.Pagos||[]).map(function(r){
    var v=r.vals;
    return {id:"p"+r.fila, fila:r.fila, mes:mesTxt(v[0]), clave:String(v[1]||""),
            concepto:v[2]||"", monto:+v[3]||0, fecha:String(v[4]).slice(0,10)};
  }).filter(function(p){ return p.mes && p.clave; });
  var visto={};
  s.pagos = s.pagos.filter(function(p){
    var k=p.clave+"|"+p.mes;
    if(visto[k]) return false;
    visto[k]=1; return true;
  });
  s.ingresos = (d.Ingresos||[]).map(function(r){
    var v=r.vals;
    return {id:"i"+r.fila, fila:r.fila, concepto:v[0]||"", monto:+v[1]||0,
            desde:mesTxt(v[2]), hasta:mesTxt(v[3]), notas:v[4]||"", dia:+v[5]||0};
  }).filter(function(x){ return x.monto>0; });
  s.presupuestos = (d.Presupuesto||[]).map(function(r){
    var v=r.vals;
    return {id:"b"+r.fila, fila:r.fila, categoria:v[0]||"", tope:+v[1]||0,
            modo: String(v[2]).indexOf("Solo")===0 ? "control" : "presupuesto",
            desde:mesTxt(v[3]), hasta:mesTxt(v[4])};
  }).filter(function(x){ return x.categoria; });
  s.metas = (d.Metas||[]).map(function(r){
    var v=r.vals, t=String(v[1]||"");
    return {id:"g"+r.fila, fila:r.fila, nombre:v[0]||"", 
            tipo: t.indexOf("ingreso")>=0 ? "pctIngreso" : t.indexOf("sobrante")>=0 ? "pctSobrante" : "fijo",
            valor:+v[2]||0, objetivo:+v[3]||0, desde:mesTxt(v[4]), hasta:mesTxt(v[5]), dia:+v[6]||1};
  }).filter(function(x){ return x.nombre && x.valor>0; });
  s.fijos = (d.Fijos||[]).map(function(r){
    var v=r.vals;
    return {id:"f"+r.fila, fila:r.fila, concepto:v[0]||"", categoria:v[1]||"Otros",
            monto:+v[2]||0, desde:mesTxt(v[3]), hasta:mesTxt(v[4]),
            pago: String(v[5]).indexOf("Auto")===0 ? "Automático" : "Manual",
            dia:+v[6]||0};
  }).filter(function(x){ return x.monto>0; });
  return sanear(s);
}
function recargar(silencioso){
  if(!sesion.pin || !sesion.url) return Promise.resolve(false);
  if(cola.length){ flush(); return Promise.resolve(false); }
  if(!silencioso){ saveState="saving"; pintarSave(); }
  return api({action:"read"}).then(function(r){
    if(r && r.ok){
      S=desdeSheet(r); ultimaSync=Date.now(); saveState="ok"; cache(); render();
      if(!silencioso) toast("Actualizado desde el Sheet");
      return true;
    }
    if(r && r.error==="auth"){ toast("PIN incorrecto"); salir(); return false; }
    saveState="offline"; pintarSave(); return false;
  }, function(){
    saveState="offline"; pintarSave();
    if(!silencioso) toast("No se pudo conectar con el Sheet");
    return false;
  });
}

/* ============================================================== acciones */
function marcarPago(clave, mes, concepto, monto){
  var ex = pagoDe(clave, mes);
  if(ex){
    S.pagos = S.pagos.filter(function(p){ return p!==ex; });
    if(ex.fila) op({action:"del", hoja:"Pagos", fila:ex.fila});
    else { quitarDeCola(ex.id); cache(); }
    toast("Marcado como impago");
  } else {
    var p={id:uid(), mes:mes, clave:clave, concepto:concepto, monto:monto, fecha:hoyISO()};
    S.pagos.push(p);
    op({action:"add", hoja:"Pagos", cid:p.id, vals:[p.mes, p.clave, p.concepto, p.monto, p.fecha]});
    toast("Pagado: "+money(monto));
  }
  cache();
}

function stripHTML(proy){
  var max=Math.max.apply(null, proy.map(function(d){ return Math.abs(d.balance); }).concat([1]));
  var hayNeg=proy.some(function(d){ return d.balance<0; });
  var alto=hayNeg?34:70;
  var bars=proy.map(function(d){
    var h=Math.max(2, Math.abs(d.balance)/max*alto), neg=d.balance<0;
    return '<button data-mes="'+d.mes+'" title="'+esc(mesLbl(d.mes))+': '+money(d.balance)+'" '+
      'aria-label="'+esc(mesLbl(d.mes))+', balance '+money(d.balance)+'">'+
      '<span class="half up">'+(neg?"":'<i style="height:'+h.toFixed(0)+'px"></i>')+'</span>'+
      (hayNeg?'<span class="mid0"></span><span class="half dn">'+
        (neg?'<i style="height:'+h.toFixed(0)+'px"></i>':"")+'</span>':'')+
      '</button>';
  }).join("");
  var lbls=proy.map(function(d){
    return '<span>'+MESES[+d.mes.slice(5,7)-1].slice(0,1).toUpperCase()+'</span>'; }).join("");
  return '<div class="strip">'+bars+'</div><div class="striplbl">'+lbls+'</div>';
}

function hookCargar(){
  function bind(id,key){
    var el=document.getElementById(id);
    if(el) el.addEventListener("input", function(){ draft[key]=el.value; pintarPreview(); });
  }
  bind("f-monto","monto"); bind("f-det","detalle"); bind("f-fecha","fecha");
  bind("f-contado","contado"); bind("f-primera","primera"); bind("f-planmes","planMes");
  var fc=document.getElementById("f-cuo");
  if(fc) fc.addEventListener("input", function(){
    var v=+fc.value;
    if(v>0){ draft.cuotas=v;
      Array.prototype.forEach.call(document.querySelectorAll("#c-cuo .chip"),
        function(b){ b.setAttribute("aria-pressed","false"); }); }
    pintarPreview();
  });
  function chips(cont, attr, cb){
    var el=document.getElementById(cont);
    if(!el) return;
    el.addEventListener("click", function(e){
      var b=e.target.closest("["+attr+"]"); if(!b) return;
      Array.prototype.forEach.call(el.querySelectorAll(".chip"),
        function(x){ x.setAttribute("aria-pressed", String(x===b)); });
      cb(b.getAttribute(attr));
    });
  }
  chips("c-modo","data-modo", function(v){ draft.modo=v; vCargar(); });
  chips("c-plan","data-plan", function(v){ draft.plan = v==="1"; vCargar(); });
  chips("c-cat","data-cat", function(v){ draft.categoria=v; });
  chips("c-med","data-med", function(v){ draft.medio=v; vCargar(); });
  chips("c-cuo","data-cuo", function(v){
    draft.cuotas=+v; var f=document.getElementById("f-cuo"); if(f) f.value=""; pintarPreview(); });
  document.getElementById("btn-guardar").addEventListener("click", guardarMovimiento);
}
function draftTotales(){
  var n = medio(draft.medio).tipo==="credito" ? Math.max(1,+draft.cuotas||1) : 1;
  var v = +draft.monto||0;
  var total = draft.modo==="cuota" ? v*n : v;
  return {n:n, total:total, cuota: total/n};
}
function pintarPreview(){
  var p=document.getElementById("preview"); if(!p) return;
  var t=draftTotales();
  if(!t.total){ p.textContent="Cargá el monto y te muestro cómo impacta en los próximos meses."; return; }
  var mv = draft.plan
    ? {fecha:draft.planMes+"-01", medio:draft.medio, monto:t.total, cuotas:t.n, primera:draft.planMes}
    : {fecha:draft.fecha, medio:draft.medio, monto:t.total, cuotas:t.n, primera:draft.primera};
  var pm=primerMes(mv), um=ultimoMes(mv);
  var txt = (draft.plan? "<em>Planificado.</em> " : "")+(t.n>1
    ? "<strong>"+t.n+" cuotas de "+money(t.cuota)+"</strong> (total "+money(t.total)+"), de "+mesLbl(pm)+" a "+mesLbl(um)+"."
    : "<strong>"+money(t.total)+"</strong> impacta en "+mesLbl(pm)+".");
  var ct=+draft.contado||0;
  if(ct>0 && t.n>1){
    var tas=tasaImplicita(ct, t.cuota, t.n), recargo=(t.total/ct)-1;
    if(tas>S.config.tasaRef+0.0005)
      txt+="<br>Te cobran <strong>"+pct(tas)+" por mes</strong> ("+pct(recargo)+" más que al contado). Tu plata rinde "+
           pct(S.config.tasaRef)+": <strong>conviene pagar al contado</strong>.";
    else
      txt+="<br>Interés real <strong>"+pct(tas)+" por mes</strong>, por debajo del "+pct(S.config.tasaRef)+
           " que rinde tu plata: <strong>conviene la cuota</strong>.";
  }
  var proy=proyeccion(S.config.horizonte||24);
  var idx=diffM(pm, mesHoy);
  if(idx>=0 && idx<proy.length){
    var d=proy[idx];
    txt+="<br>Balance de "+mesLbl(pm)+": "+money(d.balance)+" → "+money(d.balance-t.cuota)+".";
    if(+S.config.saldo>0 || d.saldo!==d.acum){
      var nuevoSaldo=d.saldo-t.cuota;
      txt+="<br>Saldo proyectado a "+mesLbl(pm)+": "+money(d.saldo)+" → <strong"+
           (nuevoSaldo<0?' class="neg"':'')+">"+money(nuevoSaldo)+"</strong>.";
    }
  }
  p.innerHTML=txt;
}
function guardarMovimiento(){
  var t=draftTotales();
  if(!(t.total>0)){ toast("Falta el monto"); return; }
  var mv={id:uid(), fecha:draft.fecha||hoyISO(), detalle:draft.detalle||"(sin detalle)",
    categoria:draft.categoria, medio:draft.medio, monto:t.total, cuotas:t.n};
  if(+draft.contado>0) mv.contado=+draft.contado;
  if(mesTxt(draft.primera)) mv.primera=mesTxt(draft.primera);
  if(draft.plan){
    var pm=mesTxt(draft.planMes)||addM(mesHoy,1);
    mv.fecha=pm+"-01"; mv.primera=pm; mv.estado="Planificado";
  }
  S.movimientos.push(mv);
  op({action:"add", hoja:"Movimientos", cid:mv.id,
      vals:[mv.fecha, mv.detalle, mv.categoria, mv.medio, mv.monto, mv.cuotas,
            mv.contado||"", mv.primera||"", mv.estado||"Real"]});
  cache();
  var eraPlan = mv.estado==="Planificado";
  draft=nuevoDraft();
  toast(eraPlan? "Planificado para "+mesLbl(mv.primera,true) : "Guardado: "+money(t.total));
  setVista(eraPlan ? "meses" : "panel");
}

/* ------------------------------------------------------------- Deudas */
var filtroDeuda="todo";
function vDeudas(){
  var items=[];
  S.movimientos.forEach(function(mv){
    if(!esCredito(mv) || esPlan(mv)) return;
    var c=movCalc(mv);
    if(c.pend<=0) return;
    items.push({id:mv.id, nombre:mv.detalle, sub:mv.medio+" · "+mv.categoria, c:c,
                tasaConocida: !!(mv.contado>0 && mv.cuotas>1)});
  });
  items.sort(function(a,b){ return b.c.porPeso-a.c.porPeso || b.c.nominal-a.c.nominal; });
  var vis = filtroDeuda==="todo" ? items
          : filtroDeuda==="atraso" ? items.filter(function(i){ return i.c.atrasadas>0; })
          : items.filter(function(i){ return i.c.ahorro>1; });
  var total=items.reduce(function(a,i){ return a+i.c.nominal; },0);
  var ahorroTot=items.reduce(function(a,i){ return a+Math.max(0,i.c.ahorro); },0);
  var atrasTot=items.reduce(function(a,i){ return a+i.c.atrasadas*i.c.cuota; },0);

  var html='<section class="card">'+
    '<div class="eyebrow">Deuda activa total</div>'+
    '<div class="big">'+money(total)+'</div>'+
    '<div class="split" style="margin-top:12px">'+
      '<div class="tile"><div class="eyebrow">Cuota mensual</div><div class="mid">'+money(creditoMes(mesHoy))+'</div></div>'+
      '<div class="tile"><div class="eyebrow">Atrasado</div><div class="mid'+(atrasTot>0?" warnc":"")+'">'+money(atrasTot)+'</div></div>'+
    '</div>'+
    (ahorroTot>0? '<div class="note hint" style="margin-top:12px">Cancelando lo que conviene te ahorrás <strong>'+
      money(ahorroTot)+'</strong> frente a dejar esa plata rindiendo al '+pct(S.config.tasaRef)+' mensual.</div>':'')+
  '</section>';

  var porMedio={};
  S.movimientos.forEach(function(mv){
    if(!esCredito(mv) || esPlan(mv)) return;
    var c=movCalc(mv);
    if(c.pend<=0) return;
    if(!porMedio[mv.medio]) porMedio[mv.medio]={saldo:0, cuota:0, n:0};
    porMedio[mv.medio].saldo+=c.nominal;
    if(activoEn(mv,mesHoy)) porMedio[mv.medio].cuota+=c.cuota;
    porMedio[mv.medio].n++;
  });
  S.medios.forEach(function(m){
    var mm=mantenimientoDe(m,mesHoy);
    if(mm>0){ if(!porMedio[m.nombre]) porMedio[m.nombre]={saldo:0,cuota:0,n:0};
      porMedio[m.nombre].cuota+=mm; }
  });
  var claves=Object.keys(porMedio).sort(function(a,b){ return porMedio[b].saldo-porMedio[a].saldo; });
  if(claves.length){
    html+='<section class="card"><div class="eyebrow">Por tarjeta o préstamo</div>'+
      claves.map(function(k){
        var x=porMedio[k];
        return '<div class="rowline"><div><div style="font-weight:600">'+esc(k)+'</div>'+
          '<div class="sub">'+x.n+(x.n===1?" compra":" compras")+' · cuota de este mes '+money(x.cuota)+'</div></div>'+
          '<div class="num">'+money(x.saldo)+'</div></div>';
      }).join("")+'</section>';
  }

  html+='<div class="tabs">'+[["todo","Todo"],["conviene","Conviene cancelar"],["atraso","Con atraso"]]
    .map(function(f){ return '<button class="chip" data-filtro="'+f[0]+'" aria-pressed="'+(filtroDeuda===f[0])+'">'+f[1]+'</button>'; }).join("")+'</div>';

  if(!vis.length){

/* ------------------------------------------------------------- Agenda */
var mesAgenda=null;
function diasEnMes(mes){ return new Date(+mes.slice(0,4), +mes.slice(5,7), 0).getDate(); }
function sobreRestante(mes){
  return S.presupuestos.reduce(function(a,b){
    if(b.modo!=="presupuesto" || !vigente(b,mes)) return a;
    return a + Math.max(0, b.tope - gastadoEn(b.categoria,mes));
  },0);
}
function eventosDelMes(mes){
  var out=[];
  S.ingresos.forEach(function(x){
    if(!vigente(x,mes)) return;
    out.push({dia:+x.dia||1, tipo:"ingreso", concepto:x.concepto, monto:+x.monto||0, pagado:false});
  });
  obligaciones(mes).forEach(function(o){
    out.push({dia:+o.dia||0, tipo:o.tipo, concepto:o.concepto, detalle:o.detalle,
      monto:o.monto, clave:o.clave, mes:o.mes, pagado:pagado(o.clave,o.mes)});
  });
  S.fijos.forEach(function(f){
    if(f.pago!=="Automático" || !vigente(f,mes)) return;
    out.push({dia:+f.dia||1, tipo:"auto", concepto:f.concepto,
      detalle:f.categoria+" · débito automático", monto:+f.monto||0, pagado:true});
  });
  out.sort(function(a,b){
    var da=a.dia||99, db=b.dia||99;
    if(da!==db) return da-db;
    return (a.tipo==="ingreso"?-1:1)-(b.tipo==="ingreso"?-1:1);
  });
  return out;
}
function vAgenda(){
  var mes = mesAgenda || mesHoy;
  var esActual = mes===mesHoy;
  var hoyDia = new Date().getDate();
  var dias = diasEnMes(mes);
  var desdeDia = esActual ? hoyDia : 1;
  var diasRest = dias - desdeDia + 1;
  var ev = eventosDelMes(mes);
  var proy = proyeccion(S.config.horizonte||24);
  var idx = diffM(mes, mesHoy);
  var saldoIni;
  if(esActual) saldoIni = +S.config.saldo||0;
  else if(idx>0 && idx<=proy.length) saldoIni = proy[idx-1].saldo;
  else saldoIni = 0;

  var sobre = sobreRestante(mes);
  var diario = diasRest>0 ? sobre/diasRest : 0;

  /* recorrido día por día */
  var saldo = saldoIni, filas=[], minSaldo=saldoIni, minDia=desdeDia, ultimo=desdeDia;
  ev.forEach(function(e){
    var d = Math.min(Math.max(e.dia||1, desdeDia), dias);
    if(e.dia && e.dia<desdeDia && !e.pagado) d=desdeDia;
    if(e.pagado && e.tipo!=="ingreso") return;
    saldo -= diario*(d-ultimo);
    ultimo = d;
    saldo += (e.tipo==="ingreso" ? e.monto : -e.monto);
    if(saldo<minSaldo){ minSaldo=saldo; minDia=d; }
    filas.push({e:e, dia:d, saldo:saldo});
  });
  saldo -= diario*(dias-ultimo);

  var html='<section class="card">'+
    '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px">'+
      '<button class="iconbtn" data-agmes="'+addM(mes,-1)+'">‹</button>'+
      '<div style="text-align:center"><div class="eyebrow">Agenda</div>'+
      '<div style="font-weight:600">'+esc(mesLbl(mes,true))+'</div></div>'+
      '<button class="iconbtn" data-agmes="'+addM(mes,1)+'">›</button>'+
    '</div>'+
    '<div class="split" style="margin-top:12px">'+
      '<div class="tile"><div class="eyebrow">'+(esActual?"Arrancás con":"Venís con")+'</div>'+
        '<div class="mid">'+money(saldoIni)+'</div></div>'+
      '<div class="tile"><div class="eyebrow">Terminás con</div>'+
        '<div class="mid '+(saldo<0?"neg":"pos")+'">'+money(saldo)+'</div></div>'+
    '</div>'+
    (minSaldo<0
      ? '<div style="margin-top:10px"><span class="pill bad">⚠ El día '+minDia+' te faltan '+money(-minSaldo)+'</span></div>'
      : '')+
  '</section>';

  if(sobre>0){
    html+='<section class="card"><div class="eyebrow">Gasto diario</div>'+
      '<div class="big">'+money(diario)+'<span class="sub" style="font-size:14px"> por día</span></div>'+
      '<div class="sub">Te quedan '+money(sobre)+' repartidos en '+diasRest+(diasRest===1?" día":" días")+'.</div>'+
      '<div style="margin-top:8px">'+S.presupuestos.filter(function(b){
        return b.modo==="presupuesto" && vigente(b,mes) && b.tope>0; }).map(function(b){
        var g=gastadoEn(b.categoria,mes), r=Math.max(0,b.tope-g), u=b.tope? Math.min(1,g/b.tope):0;
        return '<div class="barrow"><span class="barlbl">'+esc(b.categoria)+'</span>'+
          '<span class="barval'+(g>b.tope?" neg":"")+'">'+money(g)+' de '+money(b.tope)+'</span>'+
          '<span class="track"><i style="width:'+(u*100).toFixed(0)+'%; background:'+
            (g>b.tope?"var(--neg)":"var(--accent)")+'"></i></span></div>';
      }).join("")+'</div></section>';
  }

  html+='<section class="card"><div class="eyebrow">Qué pagar y cuándo</div>';
  if(!filas.length && !ev.length){
    html+='<div class="empty">No hay vencimientos cargados para este mes.</div>';
  } else {
    var pend = ev.filter(function(e){ return e.tipo!=="ingreso" && !e.pagado; });
    html+='<div class="sub" style="margin-bottom:6px">'+pend.length+' por pagar · '+
      money(pend.reduce(function(a,e){ return a+e.monto; },0))+'</div>';
    html+=ev.map(function(e){
      var f=null;
      for(var i=0;i<filas.length;i++) if(filas[i].e===e) f=filas[i];
      var esIng = e.tipo==="ingreso";
      var marcable = e.clave && !esIng;
      return '<div class="pay'+(e.pagado&&!esIng?" hecho":"")+'">'+
        (marcable
          ? '<button class="check" data-pay="'+esc(e.clave)+'|'+e.mes+'|'+Math.round(e.monto)+'|'+esc(e.concepto)+'" '+
            'aria-pressed="'+(e.pagado?"true":"false")+'" aria-label="Marcar">✓</button>'
          : '<span class="diachip'+(esIng?" ing":"")+'">'+(e.dia||"—")+'</span>')+
        '<div><div class="paylbl">'+esc(e.concepto)+'</div>'+
          '<div class="sub">'+[
            e.dia? "día "+e.dia : "",
            e.detalle? esc(e.detalle) : "",
            f? '<span'+(f.saldo<0?' class="neg" style="font-weight:600"':'')+'>queda '+money(f.saldo)+'</span>' : ""
          ].filter(function(x){ return x; }).join(" · ")+'</div></div>'+
        '<div class="num'+(esIng?" pos":"")+'">'+(esIng?"+":"")+money(e.monto)+'</div>'+
      '</div>';
    }).join("");
    html+='<div class="note">El saldo que ves al lado de cada renglón es con cuánto quedás después de pagar eso, '+
      'descontando también el gasto diario. Lo que ya marcaste como pagado no se vuelve a restar.</div>';
  }
  html+='</section>';
  app.innerHTML=html;
}

    inp.addEventListener("change", function(){

  Array.prototype.forEach.call(document.querySelectorAll("[data-tope]"), function(inp){
    inp.addEventListener("change", function(){

      if(!b) return;
      b.tope=+inp.value||0; cache();
      if(b.fila) op({action:"upd", hoja:"Presupuesto", fila:b.fila, col:2, val:b.tope});

/* ------------------------------------------------------------ CSV */
function csvMov(){
  var head="Fecha,Detalle,Categoria,Medio,Tipo,Monto,Cuotas,Cuota mensual,Primer mes,Ultimo mes,Pagadas,Pendientes,Saldo\n";
  return head+S.movimientos.map(function(m){
    var c=movCalc(m);
    return [m.fecha, '"'+String(m.detalle).replace(/"/g,'""')+'"', m.categoria, m.medio,
      esCredito(m)?"Credito":"Efectivo", Math.round(m.monto), m.cuotas||1, Math.round(c.cuota),
      c.primera, c.ultima, c.pagadas, c.pend, Math.round(esCredito(m)?c.nominal:0)].join(",");
  }).join("\n")+"\n";
}
function csvProy(){
  var head="Mes,Ingresos,Fijos,Cuotas credito,Gastos efectivo,Atrasado,Total gastos,Balance,Acumulado\n";
  return head+proyeccion(S.config.horizonte||24).map(function(d){
    return [d.mes, Math.round(d.ingresos), Math.round(d.fijos), Math.round(d.credito),
      Math.round(d.efectivo), Math.round(d.atrasado), Math.round(d.gastos),
      Math.round(d.balance), Math.round(d.acum)].join(",");
  }).join("\n")+"\n";
}
function bajar(nombre, texto){
  try{
    var blob=new Blob(["﻿"+texto], {type:"text/csv;charset=utf-8;"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },500);
  }catch(e){ toast("No se pudo generar el archivo"); }
}

/* ----------------------------------------------------------- eventos */
function valorDe(id){ var e=document.getElementById(id); return e? (+e.value||0) : 0; }
function altaMedio(idNom, idTipo, idCie, idVen, idMan){
  var nom=(document.getElementById(idNom).value||"").trim();
  var tipo=document.getElementById(idTipo).value;
  if(!nom){ toast("Falta el nombre"); return false; }
  for(var i=0;i<S.medios.length;i++) if(S.medios[i].nombre===nom){ toast("Ya existe ese medio"); return false; }
  var m={id:uid(), nombre:nom, tipo:tipo==="credito"?"credito":"efectivo",
         cierre:valorDe(idCie), vence:valorDe(idVen), mant:valorDe(idMan), fila:0};
  m.mantDesde = m.mant>0 ? mesHoy : null;
  S.medios.push(m);
  op({action:"addmedio", cid:m.id, medio:{nombre:m.nombre, tipo:m.tipo, cierre:m.cierre,
      vence:m.vence, mant:m.mant, mantDesde:m.mantDesde}});
  cache(); toast("Medio agregado");
  return true;
}

document.addEventListener("click", function(e){
  var t;
  if((t=e.target.closest("[data-pay]"))){
    var partes=t.getAttribute("data-pay").split("|");
    marcarPago(partes[0], partes[1], partes[3], +partes[2]);
    vPanel(); return;
  }
  if((t=e.target.closest("[data-nav]"))){ setVista(t.getAttribute("data-nav")); return; }
  if((t=e.target.closest("[data-agmes]"))){
    mesAgenda=t.getAttribute("data-agmes"); vAgenda(); return;
  }
  if((t=e.target.closest("[data-filtro]"))){ filtroDeuda=t.getAttribute("data-filtro"); vDeudas(); return; }
  if((t=e.target.closest("[data-mes]"))){
    var m=t.getAttribute("data-mes");
    mesAbierto=(mesAbierto===m && vista==="meses")? null : m;
    setVista("meses"); return;
  }
  if((t=e.target.closest("[data-delm]"))){
    borrarItem("movimientos","Movimientos", t.getAttribute("data-delm"));
    toast("Movimiento borrado"); render(); return;
  }
  if((t=e.target.closest("[data-confirmar]"))){
    var idc2=t.getAttribute("data-confirmar");
    var mvc=itemPorId(S.movimientos, idc2);
    if(mvc){
      delete mvc.estado;
      if(mvc.fila) op({action:"upd", hoja:"Movimientos", fila:mvc.fila, col:9, val:"Real"});
      cache(); toast("Pasó a real"); render();
    }
    return;
  }
  if((t=e.target.closest("[data-delpago]"))){
    borrarItem("pagos","Pagos", t.getAttribute("data-delpago"));
    toast("Pago borrado"); vLista(); return;
  }
  if((t=e.target.closest("[data-deli]"))){
    borrarItem("ingresos","Ingresos", t.getAttribute("data-deli")); vAjustes(); return;
  }
  if((t=e.target.closest("[data-delf]"))){
    borrarItem("fijos","Fijos", t.getAttribute("data-delf")); vAjustes(); return;
  }
  if((t=e.target.closest("[data-delmed]"))){
    var idm=t.getAttribute("data-delmed");
    var it=itemPorId(S.medios, idm);
    var usado=S.movimientos.some(function(mv){ return it && mv.medio===it.nombre; });
    if(usado){ toast("Ese medio tiene movimientos cargados"); return; }
    S.medios=S.medios.filter(function(x){ return x.id!==idm; });
    if(it && it.fila) op({action:"delmedio", fila:it.fila});
    else { quitarDeCola(idm); cache(); }
    vAjustes(); return;
  }
  if((t=e.target.closest("[data-delmeta]"))){
    borrarItem("metas","Metas", t.getAttribute("data-delmeta")); vAjustes(); return;
  }
  if((t=e.target.closest("[data-delpre]"))){
    borrarItem("presupuestos","Presupuesto", t.getAttribute("data-delpre")); vAjustes(); return;
  }
  if((t=e.target.closest("[data-delcat]"))){
    var idc=t.getAttribute("data-delcat");
    var ic=itemPorId(S.categorias, idc);
    S.categorias=S.categorias.filter(function(x){ return x.id!==idc; });
    if(ic && ic.fila) op({action:"delcat", fila:ic.fila});
    else { quitarDeCola(idc); cache(); }
    vAjustes(); return;
  }
  if((t=e.target.closest("[data-pagotipo]"))){
    var idf=t.getAttribute("data-pagotipo");
    var f=itemPorId(S.fijos, idf);
    if(!f) return;
    f.pago = f.pago==="Automático" ? "Manual" : "Automático";
    if(f.fila) op({action:"upd", hoja:"Fijos", fila:f.fila, col:6, val:f.pago});
    cache(); vAjustes(); return;
  }
  if((t=e.target.closest("[data-act]"))){
    var a=t.getAttribute("data-act");
    if(a==="toggle-agrupar"){ S.config.agruparCuotas=!S.config.agruparCuotas; cache(); vPanel(); }
    else if(a==="toggle-plan"){ S.config.verPlan = S.config.verPlan===false; cache(); vPanel(); }
    else if(a==="set-saldo"){
      var v=parseFloat(document.getElementById("p-saldo").value);
      if(!isFinite(v)){ toast("Poné un número"); return; }
      S.config.saldo=v; cache(); op({action:"saldo", val:v});
      toast("Saldo actualizado"); vPanel();
    }
    else if(a==="marcar-todo"){
      var pend=atrasos();
      if(!pend.length) return;
      pend.forEach(function(o){ marcarPago(o.clave, o.mes, o.concepto, o.monto); });
      toast(pend.length+" pagos registrados"); vPanel();
    }
    else if(a==="add-medio"){ if(altaMedio("nm-nom","nm-tipo","nm-cie","","")) vCargar(); }
    else if(a==="add-medio2"){ if(altaMedio("m-nom","m-tipo","m-cie","m-ven","m-man")) vAjustes(); }
    else if(a==="add-ingreso"){
      var ic2=document.getElementById("i-con").value.trim(), im=+document.getElementById("i-mon").value;
      if(!ic2||!(im>0)){ toast("Faltan datos del ingreso"); return; }
      var ig={id:uid(), concepto:ic2, monto:im, desde:mesHoy, hasta:null};
      S.ingresos.push(ig);
      op({action:"add", hoja:"Ingresos", cid:ig.id, vals:[ig.concepto, ig.monto, ig.desde, "", ""]});
      cache(); vAjustes();
    }
    else if(a==="add-fijo"){
      var gc=document.getElementById("g-con").value.trim(), gm=+document.getElementById("g-mon").value;
      if(!gc||!(gm>0)){ toast("Faltan datos del gasto fijo"); return; }
      var fj={id:uid(), concepto:gc, categoria:document.getElementById("g-cat").value,
              monto:gm, desde:mesHoy, hasta:null, pago:"Manual"};
      S.fijos.push(fj);
      op({action:"add", hoja:"Fijos", cid:fj.id,
          vals:[fj.concepto, fj.categoria, fj.monto, fj.desde, "", "Manual", ""]});
      cache(); vAjustes();
    }
    else if(a==="add-meta"){
      var tn=document.getElementById("t-nom").value.trim();
      var tt=document.getElementById("t-tipo").value;
      var tv=parseFloat(document.getElementById("t-val").value);
      if(!tn||!isFinite(tv)||tv<=0){ toast("Faltan nombre y monto"); return; }
      var valor = tt==="fijo" ? tv : tv/100;
      var g={id:uid(), nombre:tn, tipo:tt, valor:valor,
             objetivo:+document.getElementById("t-obj").value||0,
             desde:mesHoy, hasta:null, dia:+document.getElementById("t-dia").value||1, fila:0};
      S.metas.push(g);
      var tipoTxt = tt==="fijo"?"Monto fijo":tt==="pctIngreso"?"% del ingreso":"% del sobrante";
      op({action:"add", hoja:"Metas", cid:g.id,
          vals:[g.nombre, tipoTxt, g.valor, g.objetivo||"", g.desde, "", g.dia]});
      cache(); toast("Meta agregada"); vAjustes();
    }
    else if(a==="add-pre"){
      var bc=document.getElementById("b-cat").value;
      var bt=+document.getElementById("b-tope").value||0;
      var bm=document.getElementById("b-modo").value;
      if(!(bt>0)){ toast("Poné el tope"); return; }
      for(var bi=0;bi<S.presupuestos.length;bi++) if(S.presupuestos[bi].categoria===bc){
        toast("Ya hay un presupuesto para esa categoría"); return; }
      var b={id:uid(), categoria:bc, tope:bt, modo:bm, desde:mesHoy, hasta:null, fila:0};
      S.presupuestos.push(b);
      op({action:"add", hoja:"Presupuesto", cid:b.id,
          vals:[b.categoria, b.tope, bm==="presupuesto"?"Presupuesto":"Solo control", b.desde, ""]});
      cache(); toast("Presupuesto agregado"); vAjustes();
    }
    else if(a==="add-cat"){
      var kn=document.getElementById("k-nom").value.trim();
      if(!kn){ toast("Falta el nombre"); return; }
      var ct={id:uid(), nombre:kn, fila:0};
      S.categorias.push(ct);
      op({action:"addcat", cid:ct.id, nombre:kn});
      cache(); vAjustes();
    }
    else if(a==="sync") recargar(false);
    else if(a==="reset-cache"){
      try{ localStorage.removeItem("cc_datos"); localStorage.removeItem("cc_cola"); }catch(e){}
      cola=[]; S=semilla(); vista="panel"; render();
      toast("Copia local borrada"); recargar(false);
    }
    else if(a==="salir") salir();
    else if(a==="csv-mov") bajar("movimientos.csv", csvMov());
    else if(a==="csv-proy") bajar("proyeccion.csv", csvProy());
    return;
  }
});

/* ---------------------------------------------------------- arranque */
function mostrarApp(){
  document.getElementById("gate").hidden=true;
  document.getElementById("appwrap").hidden=false;
}
function salir(){
  try{ localStorage.removeItem("cc_pin"); }catch(e){}
  sesion.pin=""; vGate("");
}
function vGate(error){
  document.getElementById("appwrap").hidden=true;
  var g=document.getElementById("gate");
  g.hidden=false;
  var pideUrl=!CC_URL;
  var hayCache=false;
  try{ hayCache=!!localStorage.getItem("cc_datos"); }catch(e){}
  g.innerHTML='<div class="card">'+
    '<h1 class="brand" style="font-size:24px">Cuentas Claras</h1>'+
    '<div class="sub" style="margin-bottom:14px">Tus finanzas, guardadas en tu propio Google Sheet.</div>'+
    (pideUrl? '<div class="field"><label for="g-url">URL de tu Apps Script</label>'+
      '<input id="g-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(sesion.url)+'"></div>':'')+
    '<div class="field"><label for="g-pin">PIN</label>'+
      '<input id="g-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div>'+
    (error? '<div class="note" style="color:var(--neg)">'+esc(error)+'</div>':'')+
    '<div style="margin-top:12px"><button class="btn" id="g-ok">Entrar</button></div>'+
    (hayCache? '<div style="margin-top:8px"><button class="btn ghost" id="g-off">Ver la última copia sin conectar</button></div>':'')+
    '<div class="note" style="margin-top:12px">El PIN es el que pusiste en el script de tu planilla. Queda guardado en este teléfono.</div>'+
  '</div>';
  var entrar=function(){
    var pin=document.getElementById("g-pin").value.trim();
    var url=pideUrl? document.getElementById("g-url").value.trim() : CC_URL;
    if(!url){ vGate("Falta la URL del script"); return; }
    if(!pin){ vGate("Escribí el PIN"); return; }
    sesion.url=url; sesion.pin=pin;
    var b=document.getElementById("g-ok"); b.disabled=true; b.textContent="Conectando…";
    api({action:"read"}).then(function(r){
      if(r && r.ok){
        try{ localStorage.setItem("cc_pin",pin); localStorage.setItem("cc_url",url); }catch(e){}
        S=desdeSheet(r); ultimaSync=Date.now(); saveState="ok"; cache();
        mostrarApp(); render(); flush();
      } else if(r && r.error==="auth"){ sesion.pin=""; vGate("PIN incorrecto"); }
      else { sesion.pin=""; vGate("El script respondió un error. Revisá que esté publicado como aplicación web."); }
    }, function(){ sesion.pin=""; vGate("No se pudo conectar. Revisá la URL y tu internet."); });
  };
  document.getElementById("g-ok").addEventListener("click", entrar);
  document.getElementById("g-pin").addEventListener("keydown", function(e){ if(e.key==="Enter") entrar(); });
  var off=document.getElementById("g-off");
  if(off) off.addEventListener("click", function(){
    try{ S=sanear(JSON.parse(localStorage.getItem("cc_datos"))); }catch(e){ S=semilla(); }
    saveState="offline"; mostrarApp(); render();
  });
}
function boot(){
  try{
    sesion.url = CC_URL || localStorage.getItem("cc_url") || "";
    sesion.pin = localStorage.getItem("cc_pin") || "";
    var raw=localStorage.getItem("cc_datos");
    if(raw){ var d=JSON.parse(raw); if(d && d.categorias) S=sanear(d); }
    var c=localStorage.getItem("cc_cola");
    if(c) cola=JSON.parse(c)||[];
  }catch(e){}
  if(sesion.pin && sesion.url){
    mostrarApp(); render();
    recargar(true).then(function(){ flush(); });
  } else { vGate(""); }
  window.addEventListener("online", function(){ flush(); });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState==="visible" && sesion.pin){
      flush();
      if(Date.now()-ultimaSync>120000) recargar(true);
    }
  });
}
boot();
})();
