<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Finanzas Pastel</title>
    <style>
        :root {
            --bg-principal: #fcfaf8; 
            --bg-panel: #ffffff;
            --texto-principal: #4a4a4a;
            --texto-secundario: #7a7a7a;
            --ingreso: #d1e7dd; 
            --egreso: #f8d7da; 
            --borde: #e9ecef;
            --acento: #cce5ff; 
            --acento-hover: #b8daff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            display: flex;
            flex-direction: column;
            height: 100vh; /* Ocupa el 100% de la pantalla */
            overflow: hidden; /* Evita el scroll de toda la pagina */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--borde);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            flex-shrink: 0;
        }

        .controles-conexion {
            display: flex;
            gap: 10px;
        }

        input, select, button {
            background-color: var(--bg-panel);
            color: var(--texto-principal);
            border: 1px solid var(--borde);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        button {
            cursor: pointer;
            background-color: var(--acento);
            border: 1px solid #b8daff;
            color: #004085;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--acento-hover);
        }

        .navegacion-meses {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            font-size: 1rem;
            color: #555;
        }

        main {
            /* Modificado: 3 columnas normales y 1 casi el doble de ancha */
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.8fr; 
            gap: 12px;
            padding: 12px;
            flex-grow: 1;
            overflow: hidden; /* Mantiene la cuadricula estatica */
        }

        .columna {
            background-color: var(--bg-panel);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--borde);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            height: 100%; /* Asegura que tome todo el alto disponible */
            overflow: hidden;
        }

        .cabecera-columna {
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid var(--borde);
            font-weight: bold;
            font-size: 0.95rem;
            background-color: #f8f9fa;
            color: #333;
            flex-shrink: 0;
        }

        .contenedor-tarjetas {
            flex-grow: 1;
            padding: 8px;
            overflow-y: auto; /* Habilita el scroll vertical interno !Importante! */
            min-height: 0; /* Truco de Flexbox para que el overflow funcione */
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Clase especial para que Pendientes tenga 2 columnas internas */
        .contenedor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-content: start; /* Para que las tarjetas no se estiren verticalmente */
        }

        .pie-columna {
            padding: 8px 10px;
            border-top: 1px solid var(--borde);
            text-align: right;
            font-weight: bold;
            font-size: 1rem;
            background-color: #f8f9fa;
            flex-shrink: 0;
        }

        .tarjeta {
            padding: 6px 10px; 
            border-radius: 4px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            gap: 4px; 
            user-select: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            font-size: 0.85rem; 
        }

        .tarjeta:active {
            cursor: grabbing;
        }

        .tarjeta.arrastrando {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .tarjeta.ingreso { background-color: var(--ingreso); color: #0f5132; }
        .tarjeta.egreso { background-color: var(--egreso); color: #842029; }

        .tarjeta-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            align-items: center;
        }
        
        .tarjeta-nombre {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
        }

        .tarjeta-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }
        
        .tarjeta-footer input {
            margin: 0 3px 0 0;
            vertical-align: middle;
        }

        .saldo-fila {
            font-size: 0.65rem;
            color: #555;
            background-color: rgba(255,255,255,0.4);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        /* Modal (sin cambios) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.4);
            display: none; justify-content: center; align-items: center; z-index: 10;
        }
        .modal {
            background-color: var(--bg-panel); padding: 20px; border-radius: 8px;
            width: 350px; display: flex; flex-direction: column; gap: 12px;
            border: 1px solid var(--borde); box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .modal h3 { margin: 0 0 10px 0; color: #333; }
        .modal-botones { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-cancelar { background-color: #f8f9fa; border: 1px solid #ddd; color: #333; }
        .btn-cancelar:hover { background-color: #e2e6ea; }
    </style>
</head>
<body>

    <header>
        <div class="controles-conexion">
            <input type="text" id="url-script" placeholder="URL de Google Apps Script" style="width: 220px;">
            <button onclick="conectarPlanilla()">Sincronizar Sheets</button>
        </div>
        <div class="navegacion-meses">
            <button onclick="cambiarMesBase(-1)">&lt;</button>
            <span id="etiqueta-rango-meses">Cargando...</span>
            <button onclick="cambiarMesBase(1)">&gt;</button>
        </div>
        <button onclick="abrirModal()">+ Nuevo Gasto/Ingreso</button>
    </header>

    <main>
        <div class="columna">
            <div class="cabecera-columna" id="titulo-mes-1">Mes 1</div>
            <div class="contenedor-tarjetas" id="col-mes-1" data-indice="0"></div>
            <div class="pie-columna" id="total-mes-1">$ 0.00</div>
        </div>
        <div class="columna">
            <div class="cabecera-columna" id="titulo-mes-2">Mes 2</div>
            <div class="contenedor-tarjetas" id="col-mes-2" data-indice="1"></div>
            <div class="pie-columna" id="total-mes-2">$ 0.00</div>
        </div>
        <div class="columna">
            <div class="cabecera-columna" id="titulo-mes-3">Mes 3</div>
            <div class="contenedor-tarjetas" id="col-mes-3" data-indice="2"></div>
            <div class="pie-columna" id="total-mes-3">$ 0.00</div>
        </div>
        <div class="columna">
            <div class="cabecera-columna">Pendientes</div>
            <!-- Se agregó la clase contenedor-grid -->
            <div class="contenedor-tarjetas contenedor-grid" id="col-pendientes" data-indice="pendiente"></div>
            <div class="pie-columna" id="total-pendientes">$ 0.00</div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-nuevo">
        <div class="modal">
            <h3>Nuevo Registro</h3>
            <input type="text" id="form-nombre" placeholder="Nombre (ej. Luz, Alquiler)">
            <input type="number" id="form-monto" placeholder="Monto">
            <select id="form-tipo">
                <option value="egreso">Egreso (Gasto)</option>
                <option value="ingreso">Ingreso</option>
            </select>
            <input type="date" id="form-fecha">
            <select id="form-estado">
                <option value="pendiente">Dejar en Pendientes</option>
                <option value="asignado">Asignar a mes correspondiente</option>
            </select>
            <div class="modal-botones">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button onclick="guardarNuevoRegistro()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        let registrosFinancieros = [];
        let fechaBase = new Date();
        fechaBase.setDate(1); 
        let urlBackend = "";
        const mesesNombres = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        function inicializar() {
            const datosGuardados = localStorage.getItem('finanzas_datos');
            if (datosGuardados) registrosFinancieros = JSON.parse(datosGuardados);
            
            const urlGuardada = localStorage.getItem('finanzas_url');
            if (urlGuardada) {
                document.getElementById('url-script').value = urlGuardada;
                urlBackend = urlGuardada;
            }

            configurarEventosDragAndDrop();
            renderizarInterfaz();
        }

        function guardarDatosLocalmente() {
            localStorage.setItem('finanzas_datos', JSON.stringify(registrosFinancieros));
        }

        async function conectarPlanilla() {
            urlBackend = document.getElementById('url-script').value;
            if (!urlBackend) return alert("Por favor ingrese la URL del script.");
            
            localStorage.setItem('finanzas_url', urlBackend);
            try {
                const respuesta = await fetch(`${urlBackend}?accion=leer`);
                const datos = await respuesta.json();
                registrosFinancieros = datos;
                guardarDatosLocalmente();
                renderizarInterfaz();
                alert("Datos sincronizados con Google Sheets.");
            } catch (error) {
                console.error("Error al cargar datos", error);
                alert("Error de conexión. Trabajando en modo local.");
            }
        }

        async function sincronizarConPlanilla() {
            guardarDatosLocalmente();
            if (!urlBackend) return;
            try {
                await fetch(urlBackend, {
                    method: 'POST',
                    body: JSON.stringify(registrosFinancieros),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } // Corregido para evitar error CORS
                });
            } catch (error) {
                console.error("Error al sincronizar", error);
            }
        }

        function cambiarMesBase(direccion) {
            fechaBase.setMonth(fechaBase.getMonth() + direccion);
            renderizarInterfaz();
        }

        function obtenerIdentificadorMes(fecha) {
            return `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}`;
        }

        function generarMesesColumnas() {
            const meses = [];
            for (let i = 0; i < 3; i++) {
                const fecha = new Date(fechaBase);
                fecha.setMonth(fechaBase.getMonth() + i);
                meses.push({
                    identificador: obtenerIdentificadorMes(fecha),
                    nombre: `${mesesNombres[fecha.getMonth()]} ${fecha.getFullYear()}`,
                    fecha: fecha
                });
            }
            return meses;
        }

        function renderizarInterfaz() {
            const mesesActivos = generarMesesColumnas();
            document.getElementById('etiqueta-rango-meses').innerText = `${mesesActivos[0].nombre} - ${mesesActivos[2].nombre}`;

            const columnasHTML = [
                document.getElementById('col-mes-1'),
                document.getElementById('col-mes-2'),
                document.getElementById('col-mes-3'),
                document.getElementById('col-pendientes')
            ];

            // Limpiar HTML
            columnasHTML.forEach(col => col.innerHTML = '');
            for (let i = 0; i < 3; i++) {
                document.getElementById(`titulo-mes-${i+1}`).innerText = mesesActivos[i].nombre;
            }

            // Variables para totales y saldos acumulados fila por fila
            const totales = [0, 0, 0, 0];
            const saldosAcumulados = [0, 0, 0];

            registrosFinancieros.forEach(registro => {
                let colDestino = -1;

                if (registro.estado === 'pendiente') {
                    colDestino = 3;
                } else {
                    const idMesRegistro = registro.fecha.substring(0, 7);
                    for (let i = 0; i < 3; i++) {
                        if (mesesActivos[i].identificador === idMesRegistro) {
                            colDestino = i;
                            break;
                        }
                    }
                }

                if (colDestino !== -1) {
                    const montoReal = registro.tipo === 'ingreso' ? registro.monto : -registro.monto;
                    
                    if (colDestino < 3) {
                        // Es un mes, sumamos al saldo acumulado de esa fila
                        saldosAcumulados[colDestino] += montoReal;
                        totales[colDestino] = saldosAcumulados[colDestino];
                        
                        // Construimos tarjeta pasándole el saldo actual
                        const tarjeta = construirTarjeta(registro, saldosAcumulados[colDestino], false);
                        columnasHTML[colDestino].appendChild(tarjeta);
                    } else {
                        // Es pendiente, no se muestra saldo por fila, solo suma al total
                        totales[3] += montoReal;
                        const tarjeta = construirTarjeta(registro, 0, true);
                        columnasHTML[3].appendChild(tarjeta);
                    }
                }
            });

            // Imprimir totales abajo
            for (let i = 0; i < 3; i++) {
                document.getElementById(`total-mes-${i+1}`).innerText = `$ ${totales[i].toFixed(2)}`;
            }
            document.getElementById('total-pendientes').innerText = `$ ${totales[3].toFixed(2)}`;
        }

        function construirTarjeta(registro, saldoFila, esPendiente) {
            const div = document.createElement('div');
            div.className = `tarjeta ${registro.tipo}`;
            div.draggable = true;
            div.id = registro.id;

            div.addEventListener('dragstart', () => div.classList.add('arrastrando'));
            div.addEventListener('dragend', () => {
                div.classList.remove('arrastrando');
                actualizarOrdenEnDatos();
            });

            const estaPagado = registro.pagado ? 'checked' : '';
            
            // HTML del saldo solo si NO es pendiente
            const htmlSaldo = esPendiente ? '' : `<span class="saldo-fila" title="Saldo acumulado">S: $${saldoFila.toFixed(0)}</span>`;

            div.innerHTML = `
                <div class="tarjeta-header">
                    <span class="tarjeta-nombre" title="${registro.nombre}">${registro.nombre}</span>
                    <span>$${registro.monto.toFixed(2)}</span>
                </div>
                <div class="tarjeta-footer">
                    <span>
                        ${registro.fecha.substring(8,10)}/${registro.fecha.substring(5,7)}
                    </span>
                    ${htmlSaldo}
                    <label>
                        <input type="checkbox" onchange="alternarEstadoPago('${registro.id}', this.checked)" ${estaPagado}> Pago
                    </label>
                </div>
            `;
            return div;
        }

        function configurarEventosDragAndDrop() {
            const contenedores = document.querySelectorAll('.contenedor-tarjetas');
            
            contenedores.forEach(contenedor => {
                contenedor.addEventListener('dragover', e => {
                    e.preventDefault(); 
                    // Se envía X e Y para calcular en cuadrículas
                    const elementoPosterior = obtenerElementoPosteriorArrastre(contenedor, e.clientX, e.clientY);
                    const tarjetaArrastrada = document.querySelector('.arrastrando');
                    
                    if (tarjetaArrastrada) {
                        if (elementoPosterior == null) {
                            contenedor.appendChild(tarjetaArrastrada);
                        } else {
                            contenedor.insertBefore(tarjetaArrastrada, elementoPosterior);
                        }
                    }
                });

                contenedor.addEventListener('drop', e => {
                    e.preventDefault();
                    const tarjetaArrastrada = document.querySelector('.arrastrando');
                    if(!tarjetaArrastrada) return;
                    
                    const registro = registrosFinancieros.find(r => r.id === tarjetaArrastrada.id);
                    const destino = contenedor.getAttribute('data-indice');
                    
                    if (destino === 'pendiente') {
                        registro.estado = 'pendiente';
                    } else {
                        const mesesActivos = generarMesesColumnas();
                        registro.estado = 'asignado';
                        const fechaDestino = mesesActivos[parseInt(destino)].fecha;
                        const dia = registro.fecha ? registro.fecha.substring(8, 10) : '01';
                        registro.fecha = `${obtenerIdentificadorMes(fechaDestino)}-${dia}`;
                    }
                });
            });
        }

        // Calcula dinámicamente utilizando X e Y para soportar listas y cuadrículas (2D)
        function obtenerElementoPosteriorArrastre(contenedor, x, y) {
            const elementos = [...contenedor.querySelectorAll('.tarjeta:not(.arrastrando)')];
            return elementos.reduce((masCercano, hijo) => {
                const caja = hijo.getBoundingClientRect();
                
                // Determinamos si el mouse está "antes" de la mitad de la tarjeta
                const cursorAntesDelCentro = (y < caja.top + caja.height / 2) || (y < caja.bottom && x < caja.left + caja.width / 2);

                if (cursorAntesDelCentro) {
                    const distanciaX = x - (caja.left + caja.width / 2);
                    const distanciaY = y - (caja.top + caja.height / 2);
                    const distanciaTotal = Math.sqrt(distanciaX * distanciaX + distanciaY * distanciaY);
                    
                    if (distanciaTotal < masCercano.distancia) {
                        return { distancia: distanciaTotal, element: hijo };
                    }
                }
                return masCercano;
            }, { distancia: Number.POSITIVE_INFINITY }).element;
        }

        function actualizarOrdenEnDatos() {
            const nuevoArray = [];
            document.querySelectorAll('.contenedor-tarjetas').forEach(contenedor => {
                contenedor.querySelectorAll('.tarjeta').forEach(tarjetaDOM => {
                    const r = registrosFinancieros.find(r => r.id === tarjetaDOM.id);
                    if(r) nuevoArray.push(r);
                });
            });

            registrosFinancieros.forEach(registro => {
                if(!nuevoArray.find(r => r.id === registro.id)) nuevoArray.push(registro);
            });

            registrosFinancieros = nuevoArray;
            renderizarInterfaz(); 
            sincronizarConPlanilla();
        }

        function alternarEstadoPago(id, estaPagado) {
            const registro = registrosFinancieros.find(r => r.id === id);
            if (registro) {
                registro.pagado = estaPagado;
                sincronizarConPlanilla();
            }
        }

        function abrirModal() {
            document.getElementById('modal-nuevo').style.display = 'flex';
            document.getElementById('form-fecha').valueAsDate = new Date();
        }

        function cerrarModal() {
            document.getElementById('modal-nuevo').style.display = 'none';
            document.getElementById('form-nombre').value = '';
            document.getElementById('form-monto').value = '';
        }

        function guardarNuevoRegistro() {
            const nombre = document.getElementById('form-nombre').value;
            const monto = parseFloat(document.getElementById('form-monto').value);
            let fecha = document.getElementById('form-fecha').value;

            if (!nombre || isNaN(monto) || !fecha) {
                return alert("Complete Nombre, Monto y Fecha.");
            }

            registrosFinancieros.push({
                id: 'id_' + Date.now(),
                nombre: nombre,
                monto: monto,
                tipo: document.getElementById('form-tipo').value,
                fecha: fecha,
                estado: document.getElementById('form-estado').value,
                pagado: false
            });

            renderizarInterfaz();
            cerrarModal();
            sincronizarConPlanilla();
        }

        window.onload = inicializar;
    </script>
</body>
</html>
