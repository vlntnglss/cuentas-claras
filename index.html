<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Finanzas Pastel</title>
    <style>
        :root {
            /* Colores ajustados para que no sean "tan blancos" */
            --bg-principal: #eaebe8; /* Gris muy suave y cálido */
            --bg-panel: #f4f5f2;     /* Un tono apenas más claro para los paneles */
            --texto-principal: #4a4a4a;
            --texto-secundario: #6c757d;
            --ingreso: #d1e7dd; 
            --egreso: #f8d7da; 
            --borde: #dcdedb;
            --acento: #cce5ff; 
            --acento-hover: #b8daff;
            --gris-pagado: #e2e6ea;
            --texto-pagado: #8a939b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            display: flex;
            flex-direction: column;
            height: 100vh; 
            overflow: hidden; 
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--borde);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            flex-shrink: 0;
        }

        .controles-conexion {
            display: flex;
            gap: 10px;
        }

        input, select, button {
            background-color: #ffffff;
            color: var(--texto-principal);
            border: 1px solid var(--borde);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        button {
            cursor: pointer;
            background-color: var(--acento);
            border: 1px solid #b8daff;
            color: #004085;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--acento-hover); }
        .btn-secundario { background-color: #e2e3e5; color: #383d41; border-color: #d6d8db; }
        .btn-secundario:hover { background-color: #d6d8db; }

        .navegacion-meses {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            font-size: 1rem;
            color: #555;
        }

        /* VISTAS */
        main.vista-columnas {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.8fr; 
            gap: 12px;
            padding: 12px;
            flex-grow: 1;
            overflow: hidden; 
        }

        section.vista-dashboard {
            display: none;
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .mostrar-dashboard section.vista-dashboard { display: block; }
        .mostrar-dashboard main.vista-columnas { display: none; }

        /* DASHBOARD STYLES */
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .dash-card {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--borde);
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .dash-card h4 { margin: 0 0 10px 0; color: var(--texto-secundario); font-size: 0.9rem; text-transform: uppercase;}
        .dash-card .monto { font-size: 1.8rem; font-weight: bold; color: var(--texto-principal); }
        .dash-card.positivo .monto { color: #0f5132; }
        .dash-card.negativo .monto { color: #842029; }
        
        .dash-detalles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .dash-panel {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--borde);
        }
        .dash-panel h3 { margin: 0 0 15px 0; font-size: 1.1rem; border-bottom: 1px solid var(--borde); padding-bottom: 8px;}
        .cat-item { margin-bottom: 12px; }
        .cat-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; font-weight: 500;}
        .cat-bar-bg { background: var(--borde); border-radius: 4px; height: 8px; overflow: hidden; }
        .cat-bar-fill { background: #842029; height: 100%; border-radius: 4px; }

        /* COLUMNAS STYLES */
        .columna {
            background-color: var(--bg-panel);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--borde);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            height: 100%; 
            overflow: hidden;
        }

        .cabecera-columna {
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid var(--borde);
            font-weight: bold;
            font-size: 0.95rem;
            background-color: rgba(0,0,0,0.03);
            flex-shrink: 0;
        }

        .contenedor-tarjetas {
            flex-grow: 1;
            padding: 8px;
            overflow-y: auto; 
            min-height: 0; 
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contenedor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-content: start; 
        }

        .pie-columna {
            padding: 8px 10px;
            border-top: 1px solid var(--borde);
            text-align: right;
            font-weight: bold;
            font-size: 1rem;
            background-color: rgba(0,0,0,0.03);
            flex-shrink: 0;
        }

        /* TARJETAS */
        .tarjeta {
            padding: 6px 10px; 
            border-radius: 4px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            gap: 4px; 
            user-select: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            font-size: 0.85rem; 
            transition: opacity 0.2s, background-color 0.2s;
        }

        .tarjeta:active { cursor: grabbing; }
        .tarjeta.arrastrando { opacity: 0.4; transform: scale(0.98); }

        .tarjeta.ingreso { background-color: var(--ingreso); color: #0f5132; }
        .tarjeta.egreso { background-color: var(--egreso); color: #842029; }
        
        /* Estado Pagado (Gris Claro) */
        .tarjeta.pagada {
            background-color: var(--gris-pagado) !important;
            color: var(--texto-pagado) !important;
            border: 1px solid #ced4da;
            box-shadow: none;
        }

        .tarjeta-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            align-items: center;
        }
        
        .tarjeta-nombre {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .badge-categoria {
            font-size: 0.6rem;
            background-color: rgba(255,255,255,0.4);
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: normal;
        }
        .tarjeta.pagada .badge-categoria { background-color: rgba(0,0,0,0.1); }

        .tarjeta-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }
        
        .tarjeta-footer input {
            margin: 0 3px 0 0;
            vertical-align: middle;
            cursor: pointer;
        }

        .saldo-fila {
            font-size: 0.65rem;
            color: #555;
            background-color: rgba(255,255,255,0.5);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
        }
        .tarjeta.pagada .saldo-fila { background-color: rgba(0,0,0,0.05); color: inherit; }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center; z-index: 10;
        }
        .modal {
            background-color: var(--bg-panel); padding: 20px; border-radius: 8px;
            width: 380px; display: flex; flex-direction: column; gap: 12px;
            border: 1px solid var(--borde); box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .modal h3 { margin: 0 0 10px 0; color: #333; }
        .modal-botones { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-cancelar { background-color: #f8f9fa; border: 1px solid #ddd; color: #333; }
        .btn-cancelar:hover { background-color: #e2e6ea; }
    </style>
</head>
<body>

    <header>
        <div class="controles-conexion">
            <input type="text" id="url-script" placeholder="URL de Google Apps Script" style="width: 220px;">
            <button onclick="conectarPlanilla()">Sincronizar Sheets</button>
            <button class="btn-secundario" id="btn-toggle-vista" onclick="alternarVista()">Ver Dashboard</button>
        </div>
        <div class="navegacion-meses">
            <button onclick="cambiarMesBase(-1)">&lt;</button>
            <span id="etiqueta-rango-meses">Cargando...</span>
            <button onclick="cambiarMesBase(1)">&gt;</button>
        </div>
        <button onclick="abrirModal()">+ Nuevo Gasto/Ingreso</button>
    </header>

    <!-- VISTA DASHBOARD -->
    <section class="vista-dashboard" id="dashboard-view">
        <div class="dash-grid">
            <div class="dash-card">
                <h4>Total Ingresos (Todos los meses)</h4>
                <div class="monto positivo" id="dash-ingresos">$ 0</div>
            </div>
            <div class="dash-card">
                <h4>Total Egresos (Todos los meses)</h4>
                <div class="monto negativo" id="dash-egresos">$ 0</div>
            </div>
            <div class="dash-card">
                <h4>Balance Proyectado Global</h4>
                <div class="monto" id="dash-balance">$ 0</div>
            </div>
        </div>
        <div class="dash-detalles">
            <div class="dash-panel">
                <h3>Gastos por Categoría</h3>
                <div id="dash-categorias">
                    <!-- Se llena con JS -->
                </div>
            </div>
            <div class="dash-panel">
                <h3>Resumen Mensual (Próximos 3 meses)</h3>
                <div id="dash-meses-resumen">
                    <!-- Se llena con JS -->
                </div>
            </div>
        </div>
    </section>

    <!-- VISTA COLUMNAS -->
    <main class="vista-columnas" id="columnas-view">
        <div class="columna">
            <div class="cabecera-columna" id="titulo-mes-1">Mes 1</div>
            <div class="contenedor-tarjetas" id="col-mes-1" data-indice="0"></div>
            <div class="pie-columna" id="total-mes-1">$ 0</div>
        </div>
        <div class="columna">
            <div class="cabecera-columna" id="titulo-mes-2">Mes 2</div>
            <div class="contenedor-tarjetas" id="col-mes-2" data-indice="1"></div>
            <div class="pie-columna" id="total-mes-2">$ 0</div>
        </div>
        <div class="columna">
            <div class="cabecera-columna" id="titulo-mes-3">Mes 3</div>
            <div class="contenedor-tarjetas" id="col-mes-3" data-indice="2"></div>
            <div class="pie-columna" id="total-mes-3">$ 0</div>
        </div>
        <div class="columna">
            <div class="cabecera-columna">Pendientes</div>
            <div class="contenedor-tarjetas contenedor-grid" id="col-pendientes" data-indice="pendiente"></div>
            <div class="pie-columna" id="total-pendientes">$ 0</div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-nuevo">
        <div class="modal">
            <h3>Nuevo Registro</h3>
            <input type="text" id="form-nombre" placeholder="Nombre (ej. Luz, Alquiler)">
            <input type="number" id="form-monto" placeholder="Monto (entero)">
            <select id="form-tipo">
                <option value="egreso">Egreso (Gasto)</option>
                <option value="ingreso">Ingreso</option>
            </select>
            <select id="form-categoria">
                <option value="Vivienda">Vivienda</option>
                <option value="Alimentos">Alimentos</option>
                <option value="Transporte">Transporte</option>
                <option value="Servicios">Servicios</option>
                <option value="Salud">Salud</option>
                <option value="Entretenimiento">Entretenimiento</option>
                <option value="Sueldo/Honorarios">Sueldo/Honorarios</option>
                <option value="Otros">Otros</option>
            </select>
            <input type="date" id="form-fecha">
            <select id="form-estado">
                <option value="pendiente">Dejar en Pendientes</option>
                <option value="asignado">Asignar a mes correspondiente</option>
            </select>
            <div class="modal-botones">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button onclick="guardarNuevoRegistro()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        let registrosFinancieros = [];
        let fechaBase = new Date();
        fechaBase.setDate(1); 
        let urlBackend = "";
        const mesesNombres = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        // Función de formateo: Sin decimales y con separador de miles
        function formatearMoneda(valor) {
            return '$ ' + Math.round(valor).toLocaleString('es-AR');
        }

        function inicializar() {
            const datosGuardados = localStorage.getItem('finanzas_datos');
            if (datosGuardados) registrosFinancieros = JSON.parse(datosGuardados);
            
            const urlGuardada = localStorage.getItem('finanzas_url');
            if (urlGuardada) {
                document.getElementById('url-script').value = urlGuardada;
                urlBackend = urlGuardada;
            }

            configurarEventosDragAndDrop();
            renderizarInterfaz();
        }

        function alternarVista() {
            const body = document.body;
            const btn = document.getElementById('btn-toggle-vista');
            if (body.classList.contains('mostrar-dashboard')) {
                body.classList.remove('mostrar-dashboard');
                btn.innerText = "Ver Dashboard";
            } else {
                body.classList.add('mostrar-dashboard');
                btn.innerText = "Ver Columnas";
                renderizarDashboard();
            }
        }

        function guardarDatosLocalmente() {
            localStorage.setItem('finanzas_datos', JSON.stringify(registrosFinancieros));
        }

        async function conectarPlanilla() {
            urlBackend = document.getElementById('url-script').value;
            if (!urlBackend) return alert("Por favor ingrese la URL del script.");
            
            localStorage.setItem('finanzas_url', urlBackend);
            try {
                const respuesta = await fetch(`${urlBackend}?accion=leer`);
                const datos = await respuesta.json();
                registrosFinancieros = datos;
                guardarDatosLocalmente();
                renderizarInterfaz();
                alert("Datos sincronizados con Google Sheets.");
            } catch (error) {
                console.error("Error al cargar datos", error);
                alert("Error de conexión. Trabajando en modo local.");
            }
        }

        async function sincronizarConPlanilla() {
            guardarDatosLocalmente();
            if (!urlBackend) return;
            try {
                await fetch(urlBackend, {
                    method: 'POST',
                    body: JSON.stringify(registrosFinancieros),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });
            } catch (error) {
                console.error("Error al sincronizar", error);
            }
        }

        function cambiarMesBase(direccion) {
            fechaBase.setMonth(fechaBase.getMonth() + direccion);
            renderizarInterfaz();
        }

        function obtenerIdentificadorMes(fecha) {
            return `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}`;
        }

        function generarMesesColumnas() {
            const meses = [];
            for (let i = 0; i < 3; i++) {
                const fecha = new Date(fechaBase);
                fecha.setMonth(fechaBase.getMonth() + i);
                meses.push({
                    identificador: obtenerIdentificadorMes(fecha),
                    nombre: `${mesesNombres[fecha.getMonth()]} ${fecha.getFullYear()}`,
                    fecha: fecha
                });
            }
            return meses;
        }

        function renderizarInterfaz() {
            const mesesActivos = generarMesesColumnas();
            document.getElementById('etiqueta-rango-meses').innerText = `${mesesActivos[0].nombre} - ${mesesActivos[2].nombre}`;

            const columnasHTML = [
                document.getElementById('col-mes-1'),
                document.getElementById('col-mes-2'),
                document.getElementById('col-mes-3'),
                document.getElementById('col-pendientes')
            ];

            columnasHTML.forEach(col => col.innerHTML = '');
            for (let i = 0; i < 3; i++) {
                document.getElementById(`titulo-mes-${i+1}`).innerText = mesesActivos[i].nombre;
            }

            const totales = [0, 0, 0, 0];
            const saldosAcumulados = [0, 0, 0];

            registrosFinancieros.forEach(registro => {
                let colDestino = -1;

                if (registro.estado === 'pendiente') {
                    colDestino = 3;
                } else {
                    const idMesRegistro = registro.fecha.substring(0, 7);
                    for (let i = 0; i < 3; i++) {
                        if (mesesActivos[i].identificador === idMesRegistro) {
                            colDestino = i;
                            break;
                        }
                    }
                }

                if (colDestino !== -1) {
                    const montoReal = registro.tipo === 'ingreso' ? registro.monto : -registro.monto;
                    
                    if (colDestino < 3) {
                        saldosAcumulados[colDestino] += montoReal;
                        totales[colDestino] = saldosAcumulados[colDestino];
                        
                        const tarjeta = construirTarjeta(registro, saldosAcumulados[colDestino], false);
                        columnasHTML[colDestino].appendChild(tarjeta);
                    } else {
                        totales[3] += montoReal;
                        const tarjeta = construirTarjeta(registro, 0, true);
                        columnasHTML[3].appendChild(tarjeta);
                    }
                }
            });

            for (let i = 0; i < 3; i++) {
                document.getElementById(`total-mes-${i+1}`).innerText = formatearMoneda(totales[i]);
            }
            document.getElementById('total-pendientes').innerText = formatearMoneda(totales[3]);

            renderizarDashboard();
        }

        function construirTarjeta(registro, saldoFila, esPendiente) {
            const div = document.createElement('div');
            // Aplicar clase .pagada si el registro está marcado como pagado
            const clasePagada = registro.pagado ? ' pagada' : '';
            div.className = `tarjeta ${registro.tipo}${clasePagada}`;
            div.draggable = true;
            div.id = registro.id;

            div.addEventListener('dragstart', () => div.classList.add('arrastrando'));
            div.addEventListener('dragend', () => {
                div.classList.remove('arrastrando');
                actualizarOrdenEnDatos();
            });

            const estaPagado = registro.pagado ? 'checked' : '';
            const htmlSaldo = esPendiente ? '' : `<span class="saldo-fila" title="Saldo acumulado">S: ${formatearMoneda(saldoFila)}</span>`;
            const categoria = registro.categoria || 'Otros';

            // Orden invertido en el footer: Fecha -> Check -> Saldo
            div.innerHTML = `
                <div class="tarjeta-header">
                    <span class="tarjeta-nombre" title="${registro.nombre}">
                        ${registro.nombre} 
                        <span class="badge-categoria">${categoria}</span>
                    </span>
                    <span>${formatearMoneda(registro.monto)}</span>
                </div>
                <div class="tarjeta-footer">
                    <span>${registro.fecha.substring(8,10)}/${registro.fecha.substring(5,7)}</span>
                    <label>
                        <input type="checkbox" onchange="alternarEstadoPago('${registro.id}', this.checked)" ${estaPagado}> Pago
                    </label>
                    ${htmlSaldo}
                </div>
            `;
            return div;
        }

        function renderizarDashboard() {
            let totalIng = 0;
            let totalEgr = 0;
            const gastosPorCat = {};
            const resumenMeses = {};

            const mesesActivos = generarMesesColumnas();
            mesesActivos.forEach(m => {
                resumenMeses[m.identificador] = { nombre: m.nombre, ingresos: 0, egresos: 0 };
            });

            registrosFinancieros.forEach(r => {
                const monto = r.monto;
                if (r.tipo === 'ingreso') totalIng += monto;
                else {
                    totalEgr += monto;
                    const cat = r.categoria || 'Otros';
                    gastosPorCat[cat] = (gastosPorCat[cat] || 0) + monto;
                }

                if (r.estado !== 'pendiente') {
                    const idMes = r.fecha.substring(0, 7);
                    if (resumenMeses[idMes]) {
                        if (r.tipo === 'ingreso') resumenMeses[idMes].ingresos += monto;
                        else resumenMeses[idMes].egresos += monto;
                    }
                }
            });

            const balance = totalIng - totalEgr;

            // Actualizar tarjetas principales
            document.getElementById('dash-ingresos').innerText = formatearMoneda(totalIng);
            document.getElementById('dash-egresos').innerText = formatearMoneda(totalEgr);
            const balEl = document.getElementById('dash-balance');
            balEl.innerText = formatearMoneda(balance);
            balEl.style.color = balance >= 0 ? '#0f5132' : '#842029';

            // Renderizar Categorías
            const catsOrdenadas = Object.entries(gastosPorCat).sort((a,b) => b[1] - a[1]);
            let htmlCats = '';
            catsOrdenadas.forEach(([cat, monto]) => {
                const porcentaje = totalEgr > 0 ? (monto / totalEgr) * 100 : 0;
                htmlCats += `
                    <div class="cat-item">
                        <div class="cat-header">
                            <span>${cat}</span>
                            <span>${formatearMoneda(monto)} (${Math.round(porcentaje)}%)</span>
                        </div>
                        <div class="cat-bar-bg">
                            <div class="cat-bar-fill" style="width: ${porcentaje}%"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('dash-categorias').innerHTML = htmlCats || '<p style="color:#777; font-size:0.9rem;">No hay egresos registrados.</p>';

            // Renderizar Resumen Mensual
            let htmlMeses = '';
            mesesActivos.forEach(m => {
                const datosMes = resumenMeses[m.identificador];
                const balMes = datosMes.ingresos - datosMes.egresos;
                const colorBal = balMes >= 0 ? '#0f5132' : '#842029';
                htmlMeses += `
                    <div class="cat-item" style="border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        <strong style="display:block; margin-bottom:5px;">${datosMes.nombre}</strong>
                        <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
                            <span style="color:#0f5132">Ingresos: ${formatearMoneda(datosMes.ingresos)}</span>
                            <span style="color:#842029">Egresos: ${formatearMoneda(datosMes.egresos)}</span>
                            <strong style="color:${colorBal}">Saldo: ${formatearMoneda(balMes)}</strong>
                        </div>
                    </div>
                `;
            });
            document.getElementById('dash-meses-resumen').innerHTML = htmlMeses;
        }

        function configurarEventosDragAndDrop() {
            const contenedores = document.querySelectorAll('.contenedor-tarjetas');
            
            contenedores.forEach(contenedor => {
                contenedor.addEventListener('dragover', e => {
                    e.preventDefault(); 
                    const elementoPosterior = obtenerElementoPosteriorArrastre(contenedor, e.clientX, e.clientY);
                    const tarjetaArrastrada = document.querySelector('.arrastrando');
                    
                    if (tarjetaArrastrada) {
                        if (elementoPosterior == null) {
                            contenedor.appendChild(tarjetaArrastrada);
                        } else {
                            contenedor.insertBefore(tarjetaArrastrada, elementoPosterior);
                        }
                    }
                });

                contenedor.addEventListener('drop', e => {
                    e.preventDefault();
                    const tarjetaArrastrada = document.querySelector('.arrastrando');
                    if(!tarjetaArrastrada) return;
                    
                    const registro = registrosFinancieros.find(r => r.id === tarjetaArrastrada.id);
                    const destino = contenedor.getAttribute('data-indice');
                    
                    if (destino === 'pendiente') {
                        registro.estado = 'pendiente';
                    } else {
                        const mesesActivos = generarMesesColumnas();
                        registro.estado = 'asignado';
                        const fechaDestino = mesesActivos[parseInt(destino)].fecha;
                        const dia = registro.fecha ? registro.fecha.substring(8, 10) : '01';
                        registro.fecha = `${obtenerIdentificadorMes(fechaDestino)}-${dia}`;
                    }
                });
            });
        }

        function obtenerElementoPosteriorArrastre(contenedor, x, y) {
            const elementos = [...contenedor.querySelectorAll('.tarjeta:not(.arrastrando)')];
            return elementos.reduce((masCercano, hijo) => {
                const caja = hijo.getBoundingClientRect();
                const cursorAntesDelCentro = (y < caja.top + caja.height / 2) || (y < caja.bottom && x < caja.left + caja.width / 2);

                if (cursorAntesDelCentro) {
                    const distanciaX = x - (caja.left + caja.width / 2);
                    const distanciaY = y - (caja.top + caja.height / 2);
                    const distanciaTotal = Math.sqrt(distanciaX * distanciaX + distanciaY * distanciaY);
                    
                    if (distanciaTotal < masCercano.distancia) {
                        return { distancia: distanciaTotal, element: hijo };
                    }
                }
                return masCercano;
            }, { distancia: Number.POSITIVE_INFINITY }).element;
        }

        function actualizarOrdenEnDatos() {
            const nuevoArray = [];
            document.querySelectorAll('.contenedor-tarjetas').forEach(contenedor => {
                contenedor.querySelectorAll('.tarjeta').forEach(tarjetaDOM => {
                    const r = registrosFinancieros.find(r => r.id === tarjetaDOM.id);
                    if(r) nuevoArray.push(r);
                });
            });

            registrosFinancieros.forEach(registro => {
                if(!nuevoArray.find(r => r.id === registro.id)) nuevoArray.push(registro);
            });

            registrosFinancieros = nuevoArray;
            renderizarInterfaz(); 
            sincronizarConPlanilla();
        }

        function alternarEstadoPago(id, estaPagado) {
            const registro = registrosFinancieros.find(r => r.id === id);
            if (registro) {
                registro.pagado = estaPagado;
                
                // Actualizar la interfaz inmediatamente para reflejar el gris sin perder el foco/scroll
                const tarjeta = document.getElementById(id);
                if (tarjeta) {
                    if(estaPagado) tarjeta.classList.add('pagada');
                    else tarjeta.classList.remove('pagada');
                }
                
                sincronizarConPlanilla();
                renderizarDashboard(); // Por si queremos que el dashboard reaccione a estados futuros
            }
        }

        function abrirModal() {
            document.getElementById('modal-nuevo').style.display = 'flex';
            document.getElementById('form-fecha').valueAsDate = new Date();
        }

        function cerrarModal() {
            document.getElementById('modal-nuevo').style.display = 'none';
            document.getElementById('form-nombre').value = '';
            document.getElementById('form-monto').value = '';
        }

        function guardarNuevoRegistro() {
            const nombre = document.getElementById('form-nombre').value;
            const monto = Math.round(parseFloat(document.getElementById('form-monto').value));
            let fecha = document.getElementById('form-fecha').value;
            const categoria = document.getElementById('form-categoria').value;

            if (!nombre || isNaN(monto) || !fecha) {
                return alert("Complete Nombre, Monto y Fecha.");
            }

            registrosFinancieros.push({
                id: 'id_' + Date.now(),
                nombre: nombre,
                monto: monto,
                tipo: document.getElementById('form-tipo').value,
                categoria: categoria,
                fecha: fecha,
                estado: document.getElementById('form-estado').value,
                pagado: false
            });

            renderizarInterfaz();
            cerrarModal();
            sincronizarConPlanilla();
        }

        window.onload = inicializar;
    </script>
</body>
</html>
